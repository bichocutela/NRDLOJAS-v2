name: Validar atalho Mestre no banner

on:
  push:
    branches: ["feat/master-banner-double-tap"]
    paths:
      - ".github/workflows/validate-master-banner-double-tap.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Preparar Gradle
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json
      - name: Compilar Kotlin do app
        env:
          ACP_LOGIN: ${{ secrets.ACP_LOGIN }}
          ACP_PASSWORD: ${{ secrets.ACP_PASSWORD }}
        run: ./gradlew :app:compileDebugKotlin --stacktrace
