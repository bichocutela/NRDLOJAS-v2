name: Substituir Esquenta Volta às Aulas
on:
  push:
    branches: [codex/retomar-esquenta-aulas-2027]
    paths: ['.github/workflows/retomar-esquenta-aulas-2027.yml']
permissions:
  contents: read
jobs:
  substituir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Conferir script 0
        run: python -m py_compile scripts/retomar-esquenta-aulas-2027.py
      - name: Preparar fundo 0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-key.json" --quiet
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python scripts/retomar-esquenta-aulas-2027.py prepare
      - name: Guardar configuração 0
        uses: actions/upload-artifact@v4
        with:
          name: backup-retomar-aulas-antes-versao-imersiva
          path: backup-retomar-aulas.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar fundo 0
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python scripts/retomar-esquenta-aulas-2027.py apply
