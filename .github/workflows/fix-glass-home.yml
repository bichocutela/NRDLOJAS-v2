name: Corrigir Glass Home

on:
  push:
    paths:
      - '.github/workflows/fix-glass-home.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção cirúrgica
        run: python3 tools/fix_glass_home.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/SearchScreen.kt
          git commit -m "Corrige cores do Glass multicolorido na Home"
          git push
