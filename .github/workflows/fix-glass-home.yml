name: Corrigir Glass Home

on:
  push:
    paths:
      - '.github/workflows/fix-glass-home.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção cirúrgica
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          text = path.read_text(encoding='utf-8')

          brush_pattern = re.compile(
              r'\n\s*val glassActionBrush = remember\(glassAccentPalette\) \{\s*\n\s*Brush\.verticalGradient\(glassAccentPalette\)\s*\n\s*\}\s*\n',
              re.MULTILINE,
          )
          brush_replacement = '''
    val glassSessionAccent = remember(glassAccentColor) {
        if (glassAccentColor == "multicolor") {
            listOf(
                Color(0xFFE5252A), Color(0xFF2E9D44), Color(0xFFF28C18),
                Color(0xFF2474D2), Color(0xFFC99A14)
            ).random()
        } else {
            glassAccentPalette.first()
        }
    }
    val glassActionBrush = remember(glassSessionAccent, isDarkGlass) {
        Brush.verticalGradient(
            listOf(
                glassSessionAccent.copy(alpha = if (isDarkGlass) 0.82f else 0.88f),
                glassSessionAccent.copy(alpha = if (isDarkGlass) 0.62f else 0.68f)
            )
        )
    }
'''
          text, brush_count = brush_pattern.subn(brush_replacement, text, count=1)
          if brush_count != 1:
              raise SystemExit(f'Bloco glassActionBrush encontrado {brush_count} vezes')

          category_pattern = re.compile(
              r'(?P<indent>\s*)Box\(\s*\n\s*modifier = Modifier\s*\n\s*\.clip\(RoundedCornerShape\(16\.dp\)\)\s*\n\s*\.background\(if \(glass\.enabled\) glass\.fill\.copy\(alpha = glass\.alpha\) else dynamicColors\.first\)\s*\n\s*\.border\(\s*\n\s*1\.dp,\s*\n\s*if \(glass\.enabled\) glass\.border else Color\.Transparent,\s*\n\s*RoundedCornerShape\(16\.dp\)\s*\n\s*\)',
              re.MULTILINE,
          )
          match = category_pattern.search(text)
          if not match:
              raise SystemExit('Bloco de categorias não encontrado')
          indent = match.group('indent')
          category_replacement = f'''{indent}val categoryGlassFill = if (glass.enabled) {{
{indent}    dynamicColors.first.copy(alpha = if (MaterialTheme.colorScheme.background.luminance() < 0.35f) 0.28f else 0.18f)
{indent}}} else dynamicColors.first
{indent}val categoryGlassBorder = if (glass.enabled) {{
{indent}    dynamicColors.first.copy(alpha = 0.78f)
{indent}}} else Color.Transparent
{indent}Box(
{indent}    modifier = Modifier
{indent}        .clip(RoundedCornerShape(16.dp))
{indent}        .background(categoryGlassFill)
{indent}        .border(
{indent}            1.dp,
{indent}            categoryGlassBorder,
{indent}            RoundedCornerShape(16.dp)
{indent}        )'''
          text = text[:match.start()] + category_replacement + text[match.end():]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/SearchScreen.kt
          git commit -m "Corrige cores do Glass multicolorido na Home"
          git push
