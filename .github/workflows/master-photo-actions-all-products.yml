name: Ações de foto do Mestre em qualquer produto

on:
  push:
    branches: ["master-photo-actions-all-products"]
    paths:
      - ".github/workflows/master-photo-actions-all-products.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alteração
        run: python3 .github/data-jobs/master-photo-actions-all-products.py

      - name: Conferir diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          git commit -m "Libera edição de foto para o Mestre em qualquer produto"
          git push
