name: Validar abertura de produto por notificacao

on:
  push:
    branches: [notification-open-product]
    paths:
      - ".github/workflows/notification-open-product.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notification-open-product
          fetch-depth: 0

      - name: Aplicar integracao de notificacoes com produto
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 trecho, encontrado {count}\nTRECHO:\n{old}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/src/main/java/com/example/data/UserPreferences.kt',
              '''data class AppNotification(\n    val id: Long,\n    val type: String,\n    val title: String,\n    val body: String,\n    val read: Boolean,\n    val timestamp: Long\n)''',
              '''data class AppNotification(\n    val id: Long,\n    val type: String,\n    val title: String,\n    val body: String,\n    val read: Boolean,\n    val timestamp: Long,\n    val productCode: String? = null\n)'''
          )
          replace_once(
              'app/src/main/java/com/example/data/UserPreferences.kt',
              '''                put("timestamp", item.timestamp)''',
              '''                put("timestamp", item.timestamp)\n                if (!item.productCode.isNullOrBlank()) put("productCode", item.productCode)'''
          )
          replace_once(
              'app/src/main/java/com/example/data/UserPreferences.kt',
              '''                read = item.optBoolean("read", false),\n                timestamp = item.optLong("timestamp")''',
              '''                read = item.optBoolean("read", false),\n                timestamp = item.optLong("timestamp"),\n                productCode = item.optString("productCode").trim().takeIf { it.isNotBlank() }'''
          )

          replace_once(
              'app/src/main/java/com/example/util/MyFirebaseMessagingService.kt',
              '''                    body = body,\n                    read = false,\n                    timestamp = System.currentTimeMillis()''',
              '''                    body = body,\n                    read = false,\n                    timestamp = System.currentTimeMillis(),\n                    productCode = productCode'''
          )

          replace_once(
              'app/src/main/java/com/example/MainActivity.kt',
              '''                                AppNavGraph(\n                                viewModel = viewModel,\n                                openAboutFromNotification = openAboutFromNotification,\n                                openPromotionsFromNotification = openPromotionsFromNotification\n                                )''',
              '''                                AppNavGraph(\n                                viewModel = viewModel,\n                                openAboutFromNotification = openAboutFromNotification,\n                                openPromotionsFromNotification = openPromotionsFromNotification,\n                                productCodeFromNotification = productCodeFromNotification\n                                )'''
          )

          replace_once(
              'app/src/main/java/com/example/ui/AppNavGraph.kt',
              '''fun AppNavGraph(\n    viewModel: MainViewModel,\n    openAboutFromNotification: Boolean = false,\n    openPromotionsFromNotification: Boolean = false\n) {''',
              '''fun AppNavGraph(\n    viewModel: MainViewModel,\n    openAboutFromNotification: Boolean = false,\n    openPromotionsFromNotification: Boolean = false,\n    productCodeFromNotification: String? = null\n) {'''
          )
          replace_once(
              'app/src/main/java/com/example/ui/AppNavGraph.kt',
              '''                    SearchScreen(\n                        viewModel = viewModel,\n                        onOpenDrawer = { scope.launch { drawerState.open() } },''',
              '''                    SearchScreen(\n                        viewModel = viewModel,\n                        notificationProductCode = productCodeFromNotification,\n                        onOpenDrawer = { scope.launch { drawerState.open() } },'''
          )

          replace_once(
              'app/src/main/java/com/example/ui/SearchScreen.kt',
              '''fun SearchScreen(\n    viewModel: MainViewModel,\n    onOpenDrawer: () -> Unit = {},''',
              '''fun SearchScreen(\n    viewModel: MainViewModel,\n    notificationProductCode: String? = null,\n    onOpenDrawer: () -> Unit = {},'''
          )
          replace_once(
              'app/src/main/java/com/example/ui/SearchScreen.kt',
              '''    var showNotificationsSheet by remember { mutableStateOf(false) }\n    var selectedNotificationProduct by remember { mutableStateOf<Product?>(null) }\n\n    LaunchedEffect(allProducts) {''',
              '''    var showNotificationsSheet by remember { mutableStateOf(false) }\n    var selectedNotificationProduct by remember { mutableStateOf<Product?>(null) }\n    var handledNotificationProductCode by remember { mutableStateOf<String?>(null) }\n\n    LaunchedEffect(notificationProductCode, allProducts) {\n        val code = notificationProductCode?.trim().orEmpty()\n        if (code.isBlank() || handledNotificationProductCode == code) return@LaunchedEffect\n        val resolvedProduct = allProducts.firstOrNull { it.code.trim() == code }\n        if (resolvedProduct != null) {\n            handledNotificationProductCode = code\n            selectedNotificationProduct = resolvedProduct\n            viewModel.onProductSearched(resolvedProduct)\n        }\n    }\n\n    LaunchedEffect(allProducts) {'''
          )
          replace_once(
              'app/src/main/java/com/example/ui/SearchScreen.kt',
              '''                                    val notificationTarget = notification.body.trim()\n                                    val normalizedTarget = normalizeNotificationText(notificationTarget)\n                                    val resolvedProduct = viewModel.allProducts.value.firstOrNull { it.code == notificationTarget }\n                                        ?: viewModel.allProducts.value.firstOrNull {\n                                            normalizeNotificationText(it.name) == normalizedTarget\n                                        }\n                                        ?: viewModel.allProducts.value.firstOrNull {\n                                            normalizeNotificationText(it.name).contains(normalizedTarget)\n                                        }''',
              '''                                    val directCode = notification.productCode?.trim().orEmpty()\n                                    val notificationTarget = "${notification.title} ${notification.body}".trim()\n                                    val normalizedTarget = normalizeNotificationText(notificationTarget)\n                                    val codesInText = Regex("\\\\b\\\\d{4,14}\\\\b")\n                                        .findAll(notificationTarget)\n                                        .map { it.value }\n                                        .toSet()\n                                    val resolvedProduct = viewModel.allProducts.value.firstOrNull {\n                                        directCode.isNotBlank() && it.code.trim() == directCode\n                                    } ?: viewModel.allProducts.value.firstOrNull {\n                                        it.code.trim() in codesInText\n                                    } ?: viewModel.allProducts.value.firstOrNull {\n                                        val normalizedName = normalizeNotificationText(it.name)\n                                        normalizedName.isNotBlank() && normalizedTarget.contains(normalizedName)\n                                    }'''
          )
          PY

      - name: Conferir diff
        run: git diff --check

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Corrigir Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json

      - name: Compilar Kotlin
        env:
          ACP_LOGIN: ${{ secrets.ACP_LOGIN }}
          ACP_PASSWORD: ${{ secrets.ACP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Remover workflow temporario e commitar
        run: |
          rm -f .github/workflows/notification-open-product.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/data/UserPreferences.kt \
                  app/src/main/java/com/example/util/MyFirebaseMessagingService.kt \
                  app/src/main/java/com/example/ui/AppNavGraph.kt \
                  app/src/main/java/com/example/ui/SearchScreen.kt \
                  .github/workflows/notification-open-product.yml
          git commit -m 'Abre produto direto pelas notificacoes'
          git push origin HEAD:notification-open-product
