name: Verificar acesso aos fundos restantes
on:
  push:
    branches: [codex/verificar-arquivos-restantes]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar arquivo público sem alterar dados
        run: |
          STATUS=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 'https://kkayksyzksexoarpfxyj.supabase.co/storage/v1/object/public/nrdlojas-images/theme_backgrounds/gold/f6399a5a-cae2-4dcc-ab37-0d4d9541671b.jpg')
          echo "Resposta do armazenamento: HTTP $STATUS"
          if [ "$STATUS" != 200 ]; then
            echo "::warning::Não foi possível baixar os arquivos restantes; a migração deles permanece pendente."
          fi
