name: Fix notification dialog contrast

on:
  push:
    branches: [fix-notification-dialog-contrast]
    paths:
      - ".github/workflows/fix-notification-dialog-contrast.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-notification-dialog-contrast
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Corrigir contraste do popup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/ProductBarcodeDialog.kt')
          s = p.read_text()
          old = '''                Surface(
                    shape = dialogShape,
                    color = if (highlightedFromNotification) {
                        MaterialTheme.colorScheme.primaryContainer
                    } else {
                        MaterialTheme.colorScheme.surface
                    },
                    border = if (highlightedFromNotification) {
                        BorderStroke(3.dp, MaterialTheme.colorScheme.primary)
                    } else if (glassSoftStyle.enabled) {
'''
          new = '''                Surface(
                    shape = dialogShape,
                    // Mesmo balão normal para qualquer origem. A notificação ganha apenas
                    // borda/etiqueta, sem tingir o conteúdo inteiro e destruir o contraste.
                    color = MaterialTheme.colorScheme.surface,
                    border = if (highlightedFromNotification) {
                        BorderStroke(2.dp, MaterialTheme.colorScheme.primary)
                    } else if (glassSoftStyle.enabled) {
'''
          if old not in s:
              raise SystemExit('Bloco esperado do Surface não encontrado')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Validar diff
        run: git diff --check

      - name: Compilar
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Remover workflow temporário e commitar
        run: |
          rm -f .github/workflows/fix-notification-dialog-contrast.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt .github/workflows/fix-notification-dialog-contrast.yml
          git commit -m 'Corrige contraste do produto aberto por notificacao'
          git push origin HEAD:fix-notification-dialog-contrast
