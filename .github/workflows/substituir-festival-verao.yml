name: Substituir fundo de Festival de Verão
on:
  push:
    branches: [codex/substituir-festival-verao]
    paths: ['.github/workflows/substituir-festival-verao.yml']
permissions:
  contents: read
jobs:
  substituir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Conferir script
        run: python -m py_compile scripts/substituir-festival-verao.py
      - name: Conferir imagem e preparar backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-key.json" --quiet
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python scripts/substituir-festival-verao.py prepare
      - name: Guardar configuração anterior
        uses: actions/upload-artifact@v4
        with:
          name: backup-festival-verao-antes-versao-imersiva
          path: backup-festival-verao.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar referência verificada
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python scripts/substituir-festival-verao.py apply
