name: Corrigir Glass visual

on:
  push:
    paths:
      - '.github/workflows/fix_glass_visual_balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir Glass visual
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          s = p.read_text()

          s = s.replace('Brush.horizontalGradient(glassAccentPalette)', 'Brush.verticalGradient(glassAccentPalette)')

          old = '''    val fill = if (darkGlass) {\n        when (type) {\n            "frosted" -> accent.copy(alpha = 0.62f)\n            "crystal" -> accent.copy(alpha = 0.34f)\n            else -> accent.copy(alpha = 0.48f)\n        }\n    } else {\n        when (type) {\n            "frosted" -> accent.copy(alpha = 0.22f)\n            "crystal" -> accent.copy(alpha = 0.12f)\n            else -> accent.copy(alpha = 0.17f)\n        }\n    }\n    val border = when (type) {\n        "frosted" -> Color.White.copy(alpha = 0.82f)\n        "crystal" -> Color.White.copy(alpha = 0.95f)\n        else -> Color.White.copy(alpha = 0.74f)\n    }\n    val highlight = when (type) {\n        "crystal" -> Color.White.copy(alpha = 0.78f)\n        "frosted" -> Color.White.copy(alpha = 0.48f)\n        else -> Color.White.copy(alpha = 0.58f)\n    }\n'''
          new = '''    val fill = if (darkGlass) Color(0xFF11161D) else Color.White\n    val border = when (type) {\n        "frosted" -> accent.copy(alpha = 0.58f)\n        "crystal" -> accent.copy(alpha = 0.78f)\n        else -> accent.copy(alpha = 0.66f)\n    }\n    val highlight = when (type) {\n        "crystal" -> accent.copy(alpha = 0.72f)\n        "frosted" -> accent.copy(alpha = 0.44f)\n        else -> accent.copy(alpha = 0.56f)\n    }\n'''
          if old not in s:
              raise SystemExit('glass visual fill block missing')
          s = s.replace(old, new, 1)

          # Recalibrate generic Glass alpha: enough transparency to look like glass, enough opacity for readability.
          old = '''    val baseAlpha = (1f - transparency).coerceIn(0.10f, 0.80f)\n    val alpha = when (type) {\n        "frosted" -> (baseAlpha + 0.18f).coerceIn(0.22f, 0.86f)\n        "crystal" -> (baseAlpha - 0.12f).coerceIn(0.08f, 0.62f)\n        else -> baseAlpha\n    }\n'''
          new = '''    val baseAlpha = (0.92f - transparency * 0.38f).coerceIn(0.58f, 0.86f)\n    val alpha = when (type) {\n        "frosted" -> (baseAlpha + 0.08f).coerceIn(0.68f, 0.92f)\n        "crystal" -> (baseAlpha - 0.12f).coerceIn(0.48f, 0.76f)\n        else -> baseAlpha\n    }\n'''
          if old not in s:
              raise SystemExit('glass alpha block missing')
          s = s.replace(old, new, 1)

          # SearchBar: neutral translucent glass, accent in border; no white slab or blue slab.
          s = s.replace(
              'if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else MaterialTheme.colorScheme.surfaceVariant,\n                        RoundedCornerShape(32.dp)',
              'if (isGlassTheme) { if (isDarkGlass) Color(0xFF11161D).copy(alpha = 0.78f) else Color.White.copy(alpha = 0.78f) } else MaterialTheme.colorScheme.surfaceVariant,\n                        RoundedCornerShape(32.dp)',
              1
          )
          s = s.replace(
              'if (isGlassTheme) Color.White.copy(alpha = 0.68f) else MaterialTheme.colorScheme.outline,',
              'if (isGlassTheme) glassAccentPalette.first().copy(alpha = 0.62f) else MaterialTheme.colorScheme.outline,',
              1
          )
          s = s.replace(
              'containerColor = if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else MaterialTheme.colorScheme.surfaceVariant,',
              'containerColor = if (isGlassTheme) { if (isDarkGlass) Color(0xFF11161D).copy(alpha = 0.78f) else Color.White.copy(alpha = 0.78f) } else MaterialTheme.colorScheme.surfaceVariant,',
              1
          )

          # Bottom sheets: readable neutral glass; selected color remains in controls/cards/borders.
          old_sheet = '''if (isGlassTheme) {\n                    val tint = glassAccentPalette.first()\n                    if (isDarkGlass) tint.copy(alpha = (glassSurfaceAlpha * 0.50f).coerceAtLeast(0.14f))\n                    else tint.copy(alpha = (glassSurfaceAlpha * 0.28f).coerceAtLeast(0.08f))\n                } else MaterialTheme.colorScheme.surfaceContainerLow'''
          new_sheet = '''if (isGlassTheme) {\n                    val sheetAlpha = when (glassType) {\n                        "frosted" -> 0.90f\n                        "crystal" -> 0.72f\n                        else -> 0.82f\n                    }\n                    if (isDarkGlass) Color(0xFF10151B).copy(alpha = sheetAlpha)\n                    else Color.White.copy(alpha = sheetAlpha)\n                } else MaterialTheme.colorScheme.surfaceContainerLow'''
          if s.count(old_sheet) < 3:
              raise SystemExit(f'expected 3 sheet blocks, found {s.count(old_sheet)}')
          s = s.replace(old_sheet, new_sheet, 3)
          p.write_text(s)

          p = Path('app/src/main/java/com/example/ui/ProductBarcodeDialog.kt')
          s = p.read_text()
          old = '''    val glassDialogColor = if (darkGlass) {\n        glassAccent.copy(alpha = (glassDialogAlpha * 0.62f).coerceAtLeast(0.14f))\n    } else {\n        glassAccent.copy(alpha = (glassDialogAlpha * 0.28f).coerceAtLeast(0.08f))\n    }\n    val glassDialogBorder = when (glassType) {\n        "crystal" -> Color.White.copy(alpha = 0.96f)\n        "frosted" -> Color.White.copy(alpha = 0.84f)\n        else -> Color.White.copy(alpha = 0.76f)\n    }\n'''
          new = '''    val glassDialogColor = if (darkGlass) {\n        Color(0xFF10151B).copy(alpha = when (glassType) { "frosted" -> 0.92f; "crystal" -> 0.74f; else -> 0.84f })\n    } else {\n        Color.White.copy(alpha = when (glassType) { "frosted" -> 0.92f; "crystal" -> 0.74f; else -> 0.84f })\n    }\n    val glassDialogBorder = when (glassType) {\n        "crystal" -> glassAccent.copy(alpha = 0.90f)\n        "frosted" -> glassAccent.copy(alpha = 0.62f)\n        else -> glassAccent.copy(alpha = 0.76f)\n    }\n'''
          if old not in s:
              raise SystemExit('dialog glass block missing')
          s = s.replace(old, new, 1)

          # Respect selected Glass color in key dialog accents.
          s = s.replace('color = MaterialTheme.colorScheme.primary\n                            ),', 'color = if (isGlassTheme) glassAccent else MaterialTheme.colorScheme.primary\n                            ),', 1)
          s = s.replace('color = MaterialTheme.colorScheme.secondary,', 'color = if (isGlassTheme) glassAccent else MaterialTheme.colorScheme.secondary,', 1)
          p.write_text(s)

      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/SearchScreen.kt app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          git commit -m "Recalibra transparência e gradientes do Glass"
          git push
