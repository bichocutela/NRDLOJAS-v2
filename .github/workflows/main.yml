name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - ".github/workflows/add-padaria-products.yml"
      - ".github/data-jobs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Corrigir tema local da Home uma vez
      run: |
        python3 <<'PY'
        from pathlib import Path

        prefs = Path('app/src/main/java/com/example/data/UserPreferences.kt')
        text = prefs.read_text()
        marker = '    val appearanceMode: Flow<String> = context.dataStore.data.map { preferences ->\n'
        addition = '    val appThemeWasChosen: Flow<Boolean> = context.dataStore.data.map { preferences ->\n        preferences[APP_THEME] != null\n    }\n\n'
        if 'val appThemeWasChosen:' not in text:
            if marker not in text:
                raise SystemExit('Marcador appearanceMode não encontrado')
            text = text.replace(marker, addition + marker, 1)
        prefs.write_text(text)

        home = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
        text = home.read_text()
        marker = '    val remoteAppearance by FirebaseService.observeAppearanceSettings()\n'
        addition = '    val localThemeWasChosen by viewModel.userPreferences.appThemeWasChosen.collectAsStateWithLifecycle(initialValue = false)\n'
        if 'val localThemeWasChosen by' not in text:
            if marker not in text:
                raise SystemExit('Marcador remoteAppearance não encontrado')
            text = text.replace(marker, addition + marker, 1)
        old = '    val appTheme = if (remoteAppearance.overrideLocalTheme) remoteAppearance.theme else localAppTheme\n'
        new = '    val appTheme = if (remoteAppearance.overrideLocalTheme && !localThemeWasChosen) remoteAppearance.theme else localAppTheme\n'
        if old not in text and new not in text:
            raise SystemExit('Regra appTheme não encontrada')
        text = text.replace(old, new, 1)
        home.write_text(text)
        PY
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout HEAD^ -- .github/workflows/main.yml
        git add app/src/main/java/com/example/data/UserPreferences.kt app/src/main/java/com/example/ui/SearchScreen.kt .github/workflows/main.yml
        git commit -m "Respeita tema escolhido pelo usuário também na Home"
        git push

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Debug Keystore (if missing)
      run: |
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        fi

    - name: Fix Corrupt Gradle Wrapper Jar
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        test -s app/google-services.json

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

    - name: Validate Keystore
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ ! -s release.keystore ]; then
          echo "Error: release.keystore is empty or missing."
          exit 1
        fi
        if ! keytool -list -v -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -qi "Alias name: $KEY_ALIAS"; then
          echo "Error: Keystore validation failed or alias not found."
          exit 1
        fi
        echo "Keystore validation successful."

    - name: Calculate Next Version
      id: calc_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "v1.0.130")
        if [[ "$LATEST_TAG" =~ ^v1\.0\.([0-9]+)$ ]]; then
          PATCH="${BASH_REMATCH[1]}"
        else
          PATCH=130
        fi
        if [ "$PATCH" -lt 130 ]; then PATCH=130; fi
        NEXT_PATCH=$((PATCH + 1))
        NEXT_TAG="v1.0.$NEXT_PATCH"
        echo "Calculated next tag: $NEXT_TAG"
        echo "APP_VERSION_CODE=$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "APP_VERSION_NAME=1.0.$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_ENV"
        echo "TAG=$NEXT_TAG" >> $GITHUB_OUTPUT

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
          --stacktrace

    - name: Verify APK Signature
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then echo "Error: APK not found at $APK_PATH"; exit 1; fi
        APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
        if [ -z "$APKSIGNER" ]; then echo "Error: apksigner not found."; exit 1; fi
        if ! $APKSIGNER verify --verbose "$APK_PATH"; then echo "Error: APK is not signed properly."; exit 1; fi
        echo "APK signature verified."

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NEXT_TAG }}
        name: NRDCodigos ${{ env.NEXT_TAG }}
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify Mestre about new release
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        OIDC_RESPONSE=$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nrdlojas-master-updates")
        OIDC_TOKEN=$(jq -er '.value' <<< "$OIDC_RESPONSE")
        REQUEST_BODY=$(jq -nc --arg version "$NEXT_TAG" \
          '{action: "NOTIFY_MASTER_UPDATE", version: $version}')
        curl --fail --silent --show-error --retry 3 \
          -X POST "${SUPABASE_URL%/}/functions/v1/send-fcm" \
          -H "Content-Type: application/json" \
          -H "x-github-oidc-token: $OIDC_TOKEN" \
          --data "$REQUEST_BODY"
