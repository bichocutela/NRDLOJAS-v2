name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - ".github/workflows/add-padaria-products.yml"
      - ".github/data-jobs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Apply audited Mestre panel patch
      run: |
        python - <<'PY'
        from pathlib import Path

        path = Path('app/src/main/java/com/example/ui/MestreScreen.kt')
        text = path.read_text(encoding='utf-8')
        changed = False

        replacements = [
            ('import androidx.compose.material.icons.filled.CloudSync\n', ''),
            ('    var showSyncConfirmation by remember { mutableStateOf(false) }\n', ''),
            ('                title = "Manutenção e sincronização",\n                description = "Confira o estado do catálogo remoto antes de sincronizar"\n',
             '                title = "Manutenção e diagnóstico",\n                description = "Confira o estado do catálogo local e remoto sem alterar dados"\n'),
            ('''                                    maintenanceSummary = FirebaseService.getMaintenanceSummary(
                                        localProductCount = allProducts.size,
                                        localCategoryCounts = localCategoryCounts
                                    )
''', '''                                    val result = FirebaseService.getMaintenanceSummary(
                                        localProductCount = allProducts.size,
                                        localCategoryCounts = localCategoryCounts
                                    )
                                    maintenanceSummary = result
                                    if (!result.remoteAvailable) {
                                        snackbarHostState.showSnackbar(
                                            FirebaseService.lastError ?: "Não foi possível consultar a nuvem. Tente novamente."
                                        )
                                    }
'''),
            ('''                    Spacer(modifier = Modifier.height(8.dp))
                    Button(
                        onClick = { showSyncConfirmation = true },
                        modifier = Modifier.fillMaxWidth(),
                        enabled = !isSyncing && !isLoadingMaintenance && !isLoadingCatalogHistory
                    ) {
                        if (isSyncing) {
                            CircularProgressIndicator(
                                modifier = Modifier.size(24.dp),
                                color = MaterialTheme.colorScheme.onPrimary
                            )
                            Spacer(modifier = Modifier.width(8.dp))
                            Text("Sincronizando...")
                        } else {
                            Icon(Icons.Default.CloudSync, contentDescription = null)
                            Spacer(modifier = Modifier.width(8.dp))
                            Text("Sincronizar catálogo")
                        }
                    }
''', ''),
            ('''            if (showSyncConfirmation) {
                AlertDialog(
                    onDismissRequest = { showSyncConfirmation = false },
                    title = { Text("Sincronizar catálogo?") },
                    text = {
                        val difference = maintenanceSummary?.let {
                            it.remoteProductCount - it.localProductCount
                        }
                        Text(
                            when {
                                maintenanceSummary == null ->
                                    "A rotina existente consultará o catálogo remoto e atualizará os dados locais. Continue somente se a conexão estiver disponível."
                                difference == 0 ->
                                    "O diagnóstico não encontrou diferença na quantidade de produtos. A sincronização ainda poderá atualizar nomes, categorias e imagens."
                                difference != null ->
                                    "O diagnóstico encontrou uma diferença de ${kotlin.math.abs(difference)} produto(s) entre a nuvem e este aparelho. A sincronização atualizará o catálogo local usando os dados remotos."
                                else ->
                                    "A sincronização atualizará o catálogo local usando os dados remotos."
                            }
                        )
                    },
                    confirmButton = {
                        TextButton(
                            onClick = {
                                showSyncConfirmation = false
                                viewModel.syncProductsFromFirebase()
                            }
                        ) {
                            Text("Continuar")
                        }
                    },
                    dismissButton = {
                        TextButton(onClick = { showSyncConfirmation = false }) {
                            Text("Cancelar")
                        }
                    }
                )
            }

''', '')
        ]

        for old, new in replacements:
            if old in text:
                text = text.replace(old, new, 1)
                changed = True

        if 'Text("Sincronizar catálogo")' in text or 'showSyncConfirmation' in text:
            raise SystemExit('A remoção do botão de sincronização não ficou completa.')

        if changed:
            path.write_text(text, encoding='utf-8')
        PY

        if ! git diff --quiet -- app/src/main/java/com/example/ui/MestreScreen.kt; then
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/MestreScreen.kt
          git commit -m "Remove botão de sincronizar catálogo"
          git push
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Debug Keystore (if missing)
      run: |
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        fi

    - name: Fix Corrupt Gradle Wrapper Jar
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        test -s app/google-services.json

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

    - name: Validate Keystore
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ ! -s release.keystore ]; then
          echo "Error: release.keystore is empty or missing."
          exit 1
        fi
        if ! keytool -list -v -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -qi "Alias name: $KEY_ALIAS"; then
          echo "Error: Keystore validation failed or alias not found."
          exit 1
        fi
        echo "Keystore validation successful."

    - name: Calculate Next Version
      id: calc_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "v1.0.130")
        if [[ "$LATEST_TAG" =~ ^v1\.0\.([0-9]+)$ ]]; then
          PATCH="${BASH_REMATCH[1]}"
        else
          PATCH=130
        fi
        if [ "$PATCH" -lt 130 ]; then PATCH=130; fi
        NEXT_PATCH=$((PATCH + 1))
        NEXT_TAG="v1.0.$NEXT_PATCH"
        echo "Calculated next tag: $NEXT_TAG"
        echo "APP_VERSION_CODE=$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "APP_VERSION_NAME=1.0.$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_ENV"
        echo "TAG=$NEXT_TAG" >> $GITHUB_OUTPUT

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
          --stacktrace

    - name: Verify APK Signature
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then echo "Error: APK not found at $APK_PATH"; exit 1; fi
        APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
        if [ -z "$APKSIGNER" ]; then echo "Error: apksigner not found."; exit 1; fi
        if ! $APKSIGNER verify --verbose "$APK_PATH"; then echo "Error: APK is not signed properly."; exit 1; fi
        echo "APK signature verified."

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NEXT_TAG }}
        name: NRDCodigos ${{ env.NEXT_TAG }}
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify Mestre about new release
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        OIDC_RESPONSE=$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nrdlojas-master-updates")
        OIDC_TOKEN=$(jq -er '.value' <<< "$OIDC_RESPONSE")
        REQUEST_BODY=$(jq -nc --arg version "$NEXT_TAG" \
          '{action: "NOTIFY_MASTER_UPDATE", version: $version}')
        curl --fail --silent --show-error --retry 3 \
          -X POST "${SUPABASE_URL%/}/functions/v1/send-fcm" \
          -H "Content-Type: application/json" \
          -H "x-github-oidc-token: $OIDC_TOKEN" \
          --data "$REQUEST_BODY"
