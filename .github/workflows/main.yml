name: Android CI
# Publicação acionada manualmente após correções de Consultar Produtos.

on:
  push:
    branches: [ "main", "master", "feat/acp-history-capture-test", "fix/acp-history-empty-json", "feat/acp-targeted-history" ]
    paths-ignore:
      - ".github/workflows/add-padaria-products.yml"
      - ".github/data-jobs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Debug Keystore (if missing)
      run: |
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        fi

    - name: Fix Corrupt Gradle Wrapper Jar
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        test -s app/google-services.json

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

    - name: Validate Keystore
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ ! -s release.keystore ]; then
          echo "Error: release.keystore is empty or missing."
          exit 1
        fi
        if ! keytool -list -v -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -qi "Alias name: $KEY_ALIAS"; then
          echo "Error: Keystore validation failed or alias not found."
          exit 1
        fi
        echo "Keystore validation successful."

    - name: Calculate Next Version
      id: calc_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        MAX_PATCH=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --jq '[.[].tag_name | select(test("^v1\\.0\\.[0-9]+$")) | capture("^v1\\.0\\.(?<n>[0-9]+)$").n | tonumber] | max // 130')
        if [ "$MAX_PATCH" -lt 130 ]; then MAX_PATCH=130; fi
        NEXT_PATCH=$((MAX_PATCH + 1))
        NEXT_TAG="v1.0.$NEXT_PATCH"
        echo "Calculated next tag: $NEXT_TAG"
        echo "APP_VERSION_CODE=$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "APP_VERSION_NAME=1.0.$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_ENV"
        echo "TAG=$NEXT_TAG" >> "$GITHUB_OUTPUT"

    - name: Validate bundled ACP access
      env:
        ACP_LOGIN: ${{ secrets.ACP_LOGIN }}
        ACP_PASSWORD: ${{ secrets.ACP_PASSWORD }}
      run: |
        if [ -z "$ACP_LOGIN" ] || [ -z "$ACP_PASSWORD" ]; then
          echo "Configure ACP_LOGIN and ACP_PASSWORD in repository Actions secrets before building."
          exit 1
        fi

    - name: Build with Gradle
      env:
        ACP_LOGIN: ${{ secrets.ACP_LOGIN }}
        ACP_PASSWORD: ${{ secrets.ACP_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        ./gradlew testDebugUnitTest \
          --tests 'com.example.data.GlobalProductUsageTest' \
          --tests 'com.example.data.DynamicPageScheduleTest' \
          --tests 'com.example.data.DynamicPageCodecTest' \
          --tests 'com.example.data.acp.*' \
          --tests 'com.example.data.flyer.*' \
          --tests 'com.example.ui.DynamicMediaUrlTest' \
          --tests 'com.example.ui.theme.GlassSoftThemeTest'
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
          --stacktrace

    - name: Verify APK Signature
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then echo "Error: APK not found at $APK_PATH"; exit 1; fi
        APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
        if [ -z "$APKSIGNER" ]; then echo "Error: apksigner not found."; exit 1; fi
        if ! $APKSIGNER verify --verbose "$APK_PATH"; then echo "Error: APK is not signed properly."; exit 1; fi
        echo "APK signature verified."

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
          echo "Release $NEXT_TAG já existe; reutilizando."
        else
          gh release create "$NEXT_TAG" --title "NRDCodigos $NEXT_TAG" --notes "Build automática do NRDLOJAS-v2."
        fi
        success=false
        for attempt in 1 2 3; do
          if gh release upload "$NEXT_TAG" "$APK_PATH" --clobber; then
            success=true
            break
          fi
          echo "Falha ao anexar APK na tentativa $attempt; tentando novamente..."
          sleep $((attempt * 5))
        done
        if [ "$success" != "true" ]; then
          echo "Error: não foi possível anexar o APK à release $NEXT_TAG após 3 tentativas."
          exit 1
        fi
        gh release view "$NEXT_TAG" --json tagName,isDraft,url --jq '{tag: .tagName, draft: .isDraft, url: .url}'

    - name: Notify Mestre about new release
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        OIDC_RESPONSE=$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nrdlojas-master-updates")
        OIDC_TOKEN=$(jq -er '.value' <<< "$OIDC_RESPONSE")
        REQUEST_BODY=$(jq -nc --arg version "$NEXT_TAG" \
          '{action: "NOTIFY_MASTER_UPDATE", version: $version}')
        curl --fail --silent --show-error --retry 3 \
          -X POST "${SUPABASE_URL%/}/functions/v1/send-fcm" \
          -H "Content-Type: application/json" \
          -H "x-github-oidc-token: $OIDC_TOKEN" \
          --data "$REQUEST_BODY"
