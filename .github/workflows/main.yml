name: Android CI
# Android checks and release packaging run in parallel. Publication is gated by both.

on:
  push:
    branches: [ "main", "master", "feat/acp-history-capture-test", "fix/acp-history-empty-json", "feat/acp-targeted-history" ]
    paths-ignore:
      - ".github/workflows/add-padaria-products.yml"
      - ".github/data-jobs/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "firestore.rules"
      - "supabase/**"
      - ".github/workflows/main.yml"
      - ".github/workflows/firestore-budget.yml"
      - ".github/workflows/flyer-validation.yml"
      - ".github/workflows/branch-apk.yml"
      - ".github/ci/**"
      - "scripts/ci/**"
      - "tests/ci/**"
  workflow_dispatch:

# Cancela apenas execuções antigas da mesma PR quando chegam novos commits.
# Builds de push continuam independentes para preservar a publicação de versões.
concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      android: ${{ steps.changes.outputs.android }}
      rules: ${{ steps.changes.outputs.rules }}
    steps:
    - uses: actions/checkout@v4
    - name: Classify changed paths conservatively
      id: changes
      env:
        DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: node scripts/ci/change-scope.mjs

  checks:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Restore and refresh Gradle build cache
      if: needs.scope.outputs.android == 'true'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Test CI publication and coverage contract
      run: node --test tests/ci/*.test.mjs
    - name: Verify Firebase account administration permissions
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node scripts/check-account-admin-permissions.mjs
    - name: Test ACP promotion authorization
      run: node --test supabase/functions/send-fcm/*.test.mjs supabase/functions/nrd-price-gateway/*.test.mjs supabase/functions/nrd-promotion-control/*.test.mjs supabase/functions/nrd-encartes/*.test.mjs
    - name: Test account and installation event authorization
      run: node --test supabase/functions/nrd-account-admin/*.test.mjs supabase/functions/nrd-installation-event/handler.test.mjs tests/days-off/sync.test.mjs
    - name: Verify live installation notification server
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        RESPONSE=$(curl --fail --silent --show-error "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nrd-installation-event-check" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")
        TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.value')
        echo "::add-mask::$TOKEN"
        RESULT_FILE="$(mktemp)"
        STATUS=$(curl --silent --show-error --max-time 45 -o "$RESULT_FILE" -w '%{http_code}' -X POST "https://kkayksyzksexoarpfxyj.supabase.co/functions/v1/nrd-installation-event" -H "x-github-oidc-token: $TOKEN")
        if [ "$STATUS" = "503" ] && jq -e '.error == "SERVER_NOT_READY"' "$RESULT_FILE" >/dev/null; then
          echo "::warning::Serviço de notificações indisponível. A publicação do APK continuará; notificações de instalação podem atrasar."
          echo "### Aviso: serviço de notificações indisponível (HTTP 503)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$STATUS" != "200" ]; then
          echo "::error::Falha na verificação do serviço de notificações (HTTP $STATUS)."
          exit 1
        fi
        jq -e '.ready == true' "$RESULT_FILE"
    - name: Verify committed Gradle wrapper
      if: needs.scope.outputs.android == 'true'
      uses: gradle/actions/wrapper-validation@v4

    - name: Grant execute permission for gradlew
      if: needs.scope.outputs.android == 'true'
      run: chmod +x gradlew
    - name: Create google-services.json
      if: needs.scope.outputs.android == 'true'
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        test -s app/google-services.json
    - name: Run Android tests and validate PR APK
      if: needs.scope.outputs.android == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: bash scripts/ci/android-checks.sh "${{ github.event_name == 'pull_request' && 'pr' || 'main' }}"

  package:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.calc_version.outputs.TAG }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Restore and refresh Gradle build cache
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    - name: Verify committed Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        test -s app/google-services.json
    - name: Decode Keystore
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
    - name: Validate Keystore
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ ! -s release.keystore ]; then
          echo "Error: release.keystore is empty or missing."
          exit 1
        fi
        if ! keytool -list -v -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -qi "Alias name: $KEY_ALIAS"; then
          echo "Error: Keystore validation failed or alias not found."
          exit 1
        fi
        echo "Keystore validation successful."
    - name: Calculate Next Version
      id: calc_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "v1.0.130")
        if [[ "$LATEST_TAG" =~ ^v1\.0\.([0-9]+)$ ]]; then
          PATCH="${BASH_REMATCH[1]}"
        else
          PATCH=130
        fi
        if [ "$PATCH" -lt 130 ]; then PATCH=130; fi
        NEXT_PATCH=$((PATCH + 1))
        NEXT_TAG="v1.0.$NEXT_PATCH"
        # Reserve the tag atomically: parallel merged builds must not overwrite one APK version.
        if [ "$GITHUB_REF" = "refs/heads/main" ] && { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
          RESERVED=false
          for ATTEMPT in $(seq 1 50); do
            NEXT_TAG="v1.0.$NEXT_PATCH"
            ERROR_FILE="$(mktemp)"
            if gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f "ref=refs/tags/$NEXT_TAG" -f "sha=$GITHUB_SHA" >/dev/null 2>"$ERROR_FILE"; then
              RESERVED=true
              rm -f "$ERROR_FILE"
              break
            fi
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/$NEXT_TAG" >/dev/null 2>&1; then
              cat "$ERROR_FILE"
              rm -f "$ERROR_FILE"
              exit 1
            fi
            rm -f "$ERROR_FILE"
            NEXT_PATCH=$((NEXT_PATCH + 1))
          done
          if [ "$RESERVED" != true ]; then echo "::error::Não foi possível reservar uma versão única."; exit 1; fi
        fi
        echo "Calculated next tag: $NEXT_TAG"
        echo "APP_VERSION_CODE=$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "APP_VERSION_NAME=1.0.$NEXT_PATCH" >> "$GITHUB_ENV"
        echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_ENV"
        echo "TAG=$NEXT_TAG" >> $GITHUB_OUTPUT
    - name: Build signed release APK
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
          --stacktrace
    - name: Verify APK Signature
      if: github.event_name != 'pull_request'
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then echo "Error: APK not found at $APK_PATH"; exit 1; fi
        APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
        if [ -z "$APKSIGNER" ]; then echo "Error: apksigner not found."; exit 1; fi
        if ! $APKSIGNER verify --verbose "$APK_PATH"; then echo "Error: APK is not signed properly."; exit 1; fi
        echo "APK signature verified."
    - name: Upload APK
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
    - name: Upload R8 mapping for crash diagnosis
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: r8-mapping
        path: app/build/outputs/mapping/release/mapping.txt
        if-no-files-found: error

  # Keep the existing required check name. Neither rules nor a release can be
  # published unless checks and signed packaging for this exact commit succeeded.
  build:
    if: ${{ always() && !cancelled() }}
    needs: [scope, checks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      NEXT_TAG: ${{ needs.package.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - name: Require successful validation and packaging
      env:
        SCOPE_RESULT: ${{ needs.scope.result }}
        CHECKS_RESULT: ${{ needs.checks.result }}
        PACKAGE_RESULT: ${{ needs.package.result }}
        APK_REQUIRED: ${{ needs.scope.outputs.android }}
      run: node scripts/ci/publication-gate.mjs

    - name: Download verified APK from this workflow
      if: github.event_name != 'pull_request' && needs.scope.outputs.android == 'true'
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release
    - name: Deploy Firestore rules for installation telemetry
      if: needs.scope.outputs.rules == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        set -euo pipefail
        if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT não está configurado no GitHub Actions."
          exit 1
        fi

        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-service-account.json" --quiet
        ACCESS_TOKEN="$(gcloud auth print-access-token)"

        RULESET_PAYLOAD="$(jq -Rs '{source:{files:[{name:"firestore.rules",content:.}]}}' firestore.rules)"

        TEST_RESPONSE="$(curl --silent --show-error \
          -X POST "https://firebaserules.googleapis.com/v1/projects/appcodigo-7f245:test" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          --data "$RULESET_PAYLOAD")"
        RULE_ERRORS="$(jq '[.issues[]? | select(.severity == "ERROR")] | length' <<< "$TEST_RESPONSE")"
        if [ "$RULE_ERRORS" -gt 0 ]; then
          echo "::error::As regras do Firestore têm erros de compilação:"
          jq -r '.issues[]? | select(.severity == "ERROR") | "- linha \(.sourcePosition.line // "?"): \(.description)"' <<< "$TEST_RESPONSE"
          exit 1
        fi

        CREATE_BODY="$(mktemp)"
        CREATE_STATUS="$(curl --silent --show-error \
          -o "$CREATE_BODY" -w '%{http_code}' \
          -X POST "https://firebaserules.googleapis.com/v1/projects/appcodigo-7f245/rulesets" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          --data "$RULESET_PAYLOAD")"
        if [ "$CREATE_STATUS" -lt 200 ] || [ "$CREATE_STATUS" -ge 300 ]; then
          echo "::error::Falha ao criar Ruleset (HTTP $CREATE_STATUS)."
          jq -r '.error.message // .' "$CREATE_BODY"
          exit 1
        fi
        RULESET_NAME="$(jq -er '.name' "$CREATE_BODY")"

        RELEASE_PAYLOAD="$(jq -nc \
          --arg name "projects/appcodigo-7f245/releases/cloud.firestore" \
          --arg ruleset "$RULESET_NAME" \
          '{release:{name:$name,rulesetName:$ruleset},updateMask:"rulesetName"}')"

        PATCH_BODY="$(mktemp)"
        PATCH_STATUS="$(curl --silent --show-error \
          -o "$PATCH_BODY" -w '%{http_code}' \
          -X PATCH "https://firebaserules.googleapis.com/v1/projects/appcodigo-7f245/releases/cloud.firestore" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          --data "$RELEASE_PAYLOAD")"
        if [ "$PATCH_STATUS" -lt 200 ] || [ "$PATCH_STATUS" -ge 300 ]; then
          echo "::error::Falha ao liberar Ruleset (HTTP $PATCH_STATUS)."
          jq -r '.error.message // .' "$PATCH_BODY"
          exit 1
        fi

        echo "Firestore rules published successfully: $RULESET_NAME"
    - name: Create GitHub Release
      if: needs.scope.outputs.android == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NEXT_TAG }}
        target_commitish: ${{ github.sha }}
        name: NRDCodigos ${{ env.NEXT_TAG }}
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Notify Mestre about new release
      if: needs.scope.outputs.android == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        OIDC_RESPONSE=$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nrdlojas-master-updates")
        OIDC_TOKEN=$(jq -er '.value' <<< "$OIDC_RESPONSE")
        REQUEST_BODY=$(jq -nc --arg version "$NEXT_TAG" \
          '{action: "NOTIFY_MASTER_UPDATE", version: $version}')
        curl --fail --silent --show-error --retry 3 \
          -X POST "${SUPABASE_URL%/}/functions/v1/send-fcm" \
          -H "Content-Type: application/json" \
          -H "x-github-oidc-token: $OIDC_TOKEN" \
          --data "$REQUEST_BODY"
