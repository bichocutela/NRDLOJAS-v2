name: Ajustar opt-in pull refresh ACP

on:
  push:
    branches: ["feat/acp-pull-refresh"]
    paths:
      - ".github/workflows/acp-pull-refresh-optin.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar opt-in
        run: python3 .github/data-jobs/acp-pull-refresh-optin.py
      - name: Validar diff
        run: |
          git diff --check
          git diff --stat
      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AcpProductsPanel.kt
          git commit -m "Corrige compilação do pull refresh ACP"
          git push
