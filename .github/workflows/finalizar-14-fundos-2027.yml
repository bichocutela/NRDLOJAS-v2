name: Finalizar 14 fundos imersivos
on:
  push:
    branches: [codex/finalizar-14-fundos-2027]
    paths: ['.github/workflows/finalizar-14-fundos-2027.yml']
permissions:
  contents: read
jobs:
  substituir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir script 0
        run: python -m py_compile scripts/fundo-final14-0.py
      - name: Preparar fundo 0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-key.json" --quiet
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python scripts/fundo-final14-0.py prepare
      - name: Guardar configuração 0
        uses: actions/upload-artifact@v4
        with:
          name: backup-final14-0-antes-versao-imersiva
          path: backup-final14-0.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar fundo 0
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python scripts/fundo-final14-0.py apply
