name: Corrigir Categorias Glass V2

on:
  push:
    paths:
      - '.github/workflows/fix-drawer-categories-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 tools/fix_drawer_categories_v2.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "Corrige lista e transparência das categorias Glass"
          git push
