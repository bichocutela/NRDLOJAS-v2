name: Patch exclusão mestre em todos os popups

on:
  push:
    branches:
      - feature/master-change-code-delete-actions
    paths:
      - '.github/workflows/patch-master-delete-all-dialogs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-change-code-delete-actions
          fetch-depth: 0
      - name: Ligar exclusão aos popups restantes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          s = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)onProductCodeChanged = \{ old, newCode ->\n'
              r'(?P=i)    viewModel\.updateProductSuspend\(old, old\.copy\(code = newCode\)\)\n'
              r'(?P=i)\}(?!,)'
          )

          def repl(match):
              i = match.group('i')
              return (
                  f'{i}onProductCodeChanged = {{ old, newCode ->\n'
                  f'{i}    viewModel.updateProductSuspend(old, old.copy(code = newCode))\n'
                  f'{i}}},\n'
                  f'{i}onProductDeleted = {{ target ->\n'
                  f'{i}    viewModel.deleteProductSuspend(target)\n'
                  f'{i}}}'
              )

          s, count = pattern.subn(repl, s)
          if count == 0:
              raise SystemExit('nenhum popup restante encontrado')
          path.write_text(s)
          print(f'popups restantes atualizados: {count}')

      - name: Validar callbacks
        shell: python
        run: |
          from pathlib import Path
          s = Path('app/src/main/java/com/example/ui/SearchScreen.kt').read_text()
          codes = s.count('onProductCodeChanged = { old, newCode ->')
          deletes = s.count('onProductDeleted = { target ->')
          print('alterar código:', codes, 'excluir:', deletes)
          if codes != deletes:
              raise SystemExit(f'callbacks inconsistentes: alterar={codes}, excluir={deletes}')
      - name: Validar diff
        run: git diff --check
      - name: Compilar Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Remover workflow temporário e commitar
        run: |
          rm -f .github/workflows/patch-master-delete-all-dialogs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/SearchScreen.kt .github/workflows/patch-master-delete-all-dialogs.yml
          git commit -m 'Disponibiliza exclusão mestre em todos os popups de produto'
          git push origin HEAD:feature/master-change-code-delete-actions
