name: Corrigir diagnóstico e backup 429

on:
  push:
    paths:
      - '.github/workflows/fix-diagnostic-backup-429.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções cirúrgicas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/example/ui/MainViewModel.kt')
          text = vm.read_text(encoding='utf-8')
          vm_replacements = [
              ('val snapshot = CatalogHistoryBackend.createSnapshot()',
               'val localProducts = repository.getAllProductsSync()\n                val snapshot = CatalogHistoryBackend.createSnapshot(localProducts)'),
              ('val result = CatalogHistoryBackend.restoreSnapshot(snapshotId)',
               'val currentProducts = repository.getAllProductsSync()\n                val result = CatalogHistoryBackend.restoreSnapshot(snapshotId, currentProducts)'),
          ]
          for old, new in vm_replacements:
              if old not in text:
                  raise SystemExit(f'MainViewModel: trecho não encontrado: {old}')
              text = text.replace(old, new, 1)
          vm.write_text(text, encoding='utf-8')

          screen = Path('app/src/main/java/com/example/ui/MestreScreen.kt')
          text = screen.read_text(encoding='utf-8')

          if 'import com.example.data.CatalogHistoryBackend\n' not in text:
              anchor = 'import com.example.data.CatalogSnapshot\n'
              if anchor not in text:
                  raise SystemExit('MestreScreen: import âncora não encontrado')
              text = text.replace(anchor, anchor + 'import com.example.data.CatalogHistoryBackend\n', 1)

          simple = [
              ('FirebaseService.getMaintenanceSummary(', 'CatalogHistoryBackend.getMaintenanceSummary('),
              ('MaintenanceMetricRow("Produtos na nuvem", summary.remoteProductCount.toString())',
               'MaintenanceMetricRow("Produtos na nuvem", if (summary.remoteAvailable) summary.remoteProductCount.toString() else "Não disponível")'),
              ('val differenceLabel = when {',
               'val differenceLabel = if (!summary.remoteAvailable) "Não calculada" else when {'),
              ('MaintenanceMetricRow("Abas dinâmicas", summary.dynamicTabCount.toString())',
               'MaintenanceMetricRow("Abas dinâmicas", if (summary.remoteAvailable) summary.dynamicTabCount.toString() else "Não disponível")'),
              ('MaintenanceMetricRow("Sugestões pendentes", summary.pendingSuggestionCount.toString())',
               'MaintenanceMetricRow("Sugestões pendentes", if (summary.remoteAvailable) summary.pendingSuggestionCount.toString() else "Não disponível")'),
          ]
          for old, new in simple:
              if old not in text:
                  raise SystemExit(f'MestreScreen: trecho não encontrado: {old}')
              text = text.replace(old, new, 1)

          screen.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/MainViewModel.kt app/src/main/java/com/example/ui/MestreScreen.kt
          git commit -m "Corrige diagnóstico e backup contra limite 429"
          git push
