name: Patch Ofertas Novas por Loja

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-promotions-new-offers.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch protegido
        run: |
          python3 -c 'import base64,zlib;open("/tmp/patch.py","wb").write(zlib.decompress(base64.b64decode("")))'
          python3 /tmp/patch.py

      - name: Conferir escopo da alteração
        run: |
          git diff --check
          git diff -- app/src/main/java/com/example/ui/PromotionsScreen.kt

      - name: Publicar correção no código
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/PromotionsScreen.kt
          git commit -m "Organiza Ofertas Novas por loja e abre oferta correta"
          git push origin HEAD:main
