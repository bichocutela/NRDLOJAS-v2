name: Aplicar degradê multicolorido no drawer

on:
  push:
    paths:
      - '.github/workflows/apply_multicolor_drawer_gradient.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar degradê de sessão no tema multicolorido
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()

          imports = {
              'import androidx.compose.foundation.verticalScroll\n': 'import androidx.compose.foundation.verticalScroll\nimport androidx.compose.foundation.background\n',
              'import androidx.compose.ui.Modifier\n': 'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.TextStyle\nimport androidx.compose.foundation.shape.RoundedCornerShape\n',
          }
          for old, new in imports.items():
              if old in s and new not in s:
                  s = s.replace(old, new, 1)

          old = '''    val categories by viewModel.productsCountByCategory.collectAsState()\n    val activeCategoryNames by viewModel.activeCategoryNames.collectAsState()\n    var expandedCategory by remember { mutableStateOf<String?>(null) }\n    val scope = rememberCoroutineScope()\n'''
          new = '''    val categories by viewModel.productsCountByCategory.collectAsState()\n    val activeCategoryNames by viewModel.activeCategoryNames.collectAsState()\n    val appTheme by viewModel.userPreferences.appTheme.collectAsState(initial = "multicolor")\n    val isMulticolorTheme = appTheme.trim().lowercase() == "multicolor"\n    val multicolorSessionColors = remember {\n        listOf(\n            Color(0xFFE5252A), // vermelho\n            Color(0xFF2E9D44), // verde\n            Color(0xFFF28C18), // laranja\n            Color(0xFF2474D2), // azul\n            Color(0xFFC99A14)  // dourado\n        ).shuffled()\n    }\n    val multicolorBrush = remember(multicolorSessionColors) {\n        Brush.horizontalGradient(multicolorSessionColors)\n    }\n    var expandedCategory by remember { mutableStateOf<String?>(null) }\n    val scope = rememberCoroutineScope()\n'''
          if old not in s:
              raise SystemExit('Estado do LoginDrawerContent não encontrado')
          s = s.replace(old, new, 1)

          # Administrador / Login title
          s = s.replace(
              '''                style = MaterialTheme.typography.headlineMedium,\n                color = MaterialTheme.colorScheme.primary\n''',
              '''                style = if (isMulticolorTheme) {\n                    MaterialTheme.typography.headlineMedium.merge(TextStyle(brush = multicolorBrush))\n                } else MaterialTheme.typography.headlineMedium,\n                color = if (isMulticolorTheme) Color.Unspecified else MaterialTheme.colorScheme.primary\n''',
              2
          )

          # Admin button
          old = '''                Button(\n                    onClick = onGoToAdmin,\n                    modifier = Modifier.fillMaxWidth()\n                ) {\n'''
          new = '''                Button(\n                    onClick = onGoToAdmin,\n                    modifier = if (isMulticolorTheme) {\n                        Modifier.fillMaxWidth().background(multicolorBrush, RoundedCornerShape(28.dp))\n                    } else Modifier.fillMaxWidth(),\n                    colors = if (isMulticolorTheme) {\n                        ButtonDefaults.buttonColors(containerColor = Color.Transparent, contentColor = Color.White)\n                    } else ButtonDefaults.buttonColors()\n                ) {\n'''
          if old not in s:
              raise SystemExit('Botão administrativo não encontrado')
          s = s.replace(old, new, 1)

          # Section titles: Abas Adicionais and Categorias
          for title in ['Abas Adicionais', 'Categorias']:
              old = f'''            Text(\n                text = "{title}",\n                style = MaterialTheme.typography.titleLarge,\n                color = MaterialTheme.colorScheme.primary,\n                modifier = Modifier.align(Alignment.Start)\n            )\n'''
              new = f'''            Text(\n                text = "{title}",\n                style = if (isMulticolorTheme) {{\n                    MaterialTheme.typography.titleLarge.merge(TextStyle(brush = multicolorBrush))\n                }} else MaterialTheme.typography.titleLarge,\n                color = if (isMulticolorTheme) Color.Unspecified else MaterialTheme.colorScheme.primary,\n                modifier = Modifier.align(Alignment.Start)\n            )\n'''
              if old in s:
                  s = s.replace(old, new, 1)

          # CategoryItem call
          old = '''            CategoryItem(\n                category = categoryName,\n                viewModel = viewModel,\n                isExpanded = expandedCategory == categoryName,\n                onExpandToggle = {\n'''
          new = '''            CategoryItem(\n                category = categoryName,\n                viewModel = viewModel,\n                isExpanded = expandedCategory == categoryName,\n                accentBrush = if (isMulticolorTheme) multicolorBrush else null,\n                accentColor = if (isMulticolorTheme) {\n                    multicolorSessionColors[kotlin.math.abs(categoryName.hashCode()) % multicolorSessionColors.size]\n                } else null,\n                onExpandToggle = {\n'''
          if old not in s:
              raise SystemExit('Chamada CategoryItem não encontrada')
          s = s.replace(old, new, 1)

          # Bottom buttons
          for label, callback in [('Promoções','onGoToPromotions'),('Configurações','onGoToSettings'),('Sobre','onGoToAbout')]:
              old = f'''        Button(\n            onClick = {callback},\n            modifier = Modifier.fillMaxWidth()\n        ) {{\n            Text("{label}")\n        }}\n'''
              new = f'''        Button(\n            onClick = {callback},\n            modifier = if (isMulticolorTheme) {{\n                Modifier.fillMaxWidth().background(multicolorBrush, RoundedCornerShape(28.dp))\n            }} else Modifier.fillMaxWidth(),\n            colors = if (isMulticolorTheme) {{\n                ButtonDefaults.buttonColors(containerColor = Color.Transparent, contentColor = Color.White)\n            }} else ButtonDefaults.buttonColors()\n        ) {{\n            Text("{label}")\n        }}\n'''
              if old not in s:
                  raise SystemExit(f'Botão {label} não encontrado')
              s = s.replace(old, new, 1)

          # CategoryItem signature + visuals
          old = '''fun CategoryItem(\n    category: String,\n    viewModel: MainViewModel,\n    isExpanded: Boolean,\n    onExpandToggle: () -> Unit\n) {\n'''
          new = '''fun CategoryItem(\n    category: String,\n    viewModel: MainViewModel,\n    isExpanded: Boolean,\n    accentBrush: Brush? = null,\n    accentColor: Color? = null,\n    onExpandToggle: () -> Unit\n) {\n'''
          if old not in s:
              raise SystemExit('Assinatura CategoryItem não encontrada')
          s = s.replace(old, new, 1)

          old = '''                Text(text = category, style = MaterialTheme.typography.titleMedium)\n                Icon(\n                    imageVector = if (isExpanded) Icons.Default.KeyboardArrowUp else Icons.Default.KeyboardArrowDown,\n                    contentDescription = if (isExpanded) "Recolher" else "Expandir"\n                )\n'''
          new = '''                Text(\n                    text = category,\n                    style = if (accentBrush != null) {\n                        MaterialTheme.typography.titleMedium.merge(TextStyle(brush = accentBrush))\n                    } else MaterialTheme.typography.titleMedium,\n                    color = if (accentBrush != null) Color.Unspecified else LocalContentColor.current\n                )\n                Icon(\n                    imageVector = if (isExpanded) Icons.Default.KeyboardArrowUp else Icons.Default.KeyboardArrowDown,\n                    contentDescription = if (isExpanded) "Recolher" else "Expandir",\n                    tint = accentColor ?: LocalContentColor.current\n                )\n'''
          if old not in s:
              raise SystemExit('Visual CategoryItem não encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "Adiciona degradê dinâmico ao tema multicolorido"
          git push
