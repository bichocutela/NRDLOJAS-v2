name: Renomear Consultar Preços uma vez

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rename-consultar-precos-once.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alterar somente o nome da aba
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("app/src/main/java/com/example/ui/AppNavGraph.kt")
          old = 'Text("Consultar Produtos")'
          new = 'Text("Consultar Preços")'
          text = target.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Esperava 1 ocorrência visível, encontrei {count}")
          target.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/rename-consultar-precos-once.yml").unlink()
          PY
      - name: Salvar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt .github/workflows/rename-consultar-precos-once.yml
          git commit -m "Renomeia Consultar Produtos para Consultar Preços"
          git push
