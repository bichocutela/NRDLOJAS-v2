name: Corrigir preview real dos fundos

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir imports do preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/MestreScreen.kt')
          s = p.read_text()
          anchor = 'import androidx.activity.compose.BackHandler\n'
          addition = 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable\n'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Âncora de imports não encontrada')
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/MestreScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrige compilação do preview real de fundos"
          git push
