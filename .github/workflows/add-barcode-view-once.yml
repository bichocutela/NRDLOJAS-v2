name: Corrigir destaque do popup por notificacao
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-barcode-view-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aplicar alteracao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/ui/ProductBarcodeDialog.kt')
          s=p.read_text()
          old='''                Surface(
                    shape = dialogShape,
                    color = if (highlightedFromNotification) {
                        MaterialTheme.colorScheme.primaryContainer
                    } else {
                        MaterialTheme.colorScheme.surface
                    },
                    border = if (highlightedFromNotification) {
                        BorderStroke(3.dp, MaterialTheme.colorScheme.primary)
                    } else if (glassSoftStyle.enabled) {
'''
          new='''                Surface(
                    shape = dialogShape,
                    color = MaterialTheme.colorScheme.surface,
                    border = if (highlightedFromNotification) {
                        BorderStroke(2.dp, MaterialTheme.colorScheme.primary)
                    } else if (glassSoftStyle.enabled) {
'''
          if old not in s: raise SystemExit('bloco do Surface nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remover workflow temporario
        run: rm .github/workflows/add-barcode-view-once.yml
      - name: Validar compilacao
        run: |
          git diff --check
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt .github/workflows/add-barcode-view-once.yml
          git commit -m 'Corrige contraste do produto aberto por notificacao'
          git push