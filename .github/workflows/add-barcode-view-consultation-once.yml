name: Adicionar Ver Cod Barra na consulta uma vez

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-barcode-view-consultation-once.yml
      - .github/scripts/add_barcode_view_consultation.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aplicar alteracao
        run: python3 .github/scripts/add_barcode_view_consultation.py
      - name: Validar compilacao
        run: ./gradlew assembleDebug
      - name: Remover temporarios
        run: rm .github/workflows/add-barcode-view-consultation-once.yml .github/scripts/add_barcode_view_consultation.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AcpProductsPanel.kt .github/workflows/add-barcode-view-consultation-once.yml .github/scripts/add_barcode_view_consultation.py
          git commit -m "Adiciona Ver Cod Barra reutilizando dialogo existente"
          git push
