name: Adicionar ajuste de enquadramento dos fundos

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar zoom e posição persistentes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Modelo persistente do fundo
          p = Path('app/src/main/java/com/example/data/ThemeBackground.kt')
          s = p.read_text()
          old = '''data class ThemeBackground(\n    val id: String,\n    val label: String,\n    val url: String,\n    val isActive: Boolean = false,\n    val startDate: String? = null,\n    val endDate: String? = null\n) {'''
          new = '''data class ThemeBackground(\n    val id: String,\n    val label: String,\n    val url: String,\n    val isActive: Boolean = false,\n    val startDate: String? = null,\n    val endDate: String? = null,\n    val imageScale: Float = 1f,\n    val imageOffsetX: Float = 0f,\n    val imageOffsetY: Float = 0f\n) {'''
          if old not in s:
              raise SystemExit('Modelo ThemeBackground não encontrado')
          p.write_text(s.replace(old, new, 1))

          # 2) Persistência Firestore + manifesto público
          p = Path('app/src/main/java/com/example/data/FirebaseService.kt')
          s = p.read_text()
          old = '''                        isActive = map["isActive"] as? Boolean ?: false,\n                        startDate = normalizePersistedThemeBackgroundDate(map["startDate"] as? String),\n                        endDate = normalizePersistedThemeBackgroundDate(map["endDate"] as? String)\n                    )'''
          new = '''                        isActive = map["isActive"] as? Boolean ?: false,\n                        startDate = normalizePersistedThemeBackgroundDate(map["startDate"] as? String),\n                        endDate = normalizePersistedThemeBackgroundDate(map["endDate"] as? String),\n                        imageScale = ((map["imageScale"] as? Number)?.toFloat() ?: 1f).coerceIn(0.5f, 3f),\n                        imageOffsetX = ((map["imageOffsetX"] as? Number)?.toFloat() ?: 0f).coerceIn(-1f, 1f),\n                        imageOffsetY = ((map["imageOffsetY"] as? Number)?.toFloat() ?: 0f).coerceIn(-1f, 1f)\n                    )'''
          if old not in s:
              raise SystemExit('Parser Firestore de fundos não encontrado')
          s = s.replace(old, new, 1)

          old = '''                        "url" to background.url.trim(),\n                        "isActive" to (background.isActive && startDate != null)\n                    ).apply {'''
          new = '''                        "url" to background.url.trim(),\n                        "isActive" to (background.isActive && startDate != null),\n                        "imageScale" to background.imageScale.coerceIn(0.5f, 3f),\n                        "imageOffsetX" to background.imageOffsetX.coerceIn(-1f, 1f),\n                        "imageOffsetY" to background.imageOffsetY.coerceIn(-1f, 1f)\n                    ).apply {'''
          if old not in s:
              raise SystemExit('Serialização de fundos não encontrada')
          s = s.replace(old, new, 1)

          old = '''                    isActive = item.optBoolean("isActive", false),\n                    startDate = normalizePersistedThemeBackgroundDate(item.optString("startDate")),\n                    endDate = normalizePersistedThemeBackgroundDate(item.optString("endDate"))\n                )'''
          new = '''                    isActive = item.optBoolean("isActive", false),\n                    startDate = normalizePersistedThemeBackgroundDate(item.optString("startDate")),\n                    endDate = normalizePersistedThemeBackgroundDate(item.optString("endDate")),\n                    imageScale = item.optDouble("imageScale", 1.0).toFloat().coerceIn(0.5f, 3f),\n                    imageOffsetX = item.optDouble("imageOffsetX", 0.0).toFloat().coerceIn(-1f, 1f),\n                    imageOffsetY = item.optDouble("imageOffsetY", 0.0).toFloat().coerceIn(-1f, 1f)\n                )'''
          if old not in s:
              raise SystemExit('Parser JSON de fundos não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Home aplica exatamente o enquadramento salvo
          p = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.draw.scale\n' not in s:
              anchor = 'import androidx.compose.ui.draw.clip\n'
              if anchor not in s:
                  raise SystemExit('Import clip da Home não encontrado')
              s = s.replace(anchor, anchor + 'import androidx.compose.ui.draw.scale\n', 1)

          old = '''    val normalizedTheme = remember(appTheme) { \n        when (appTheme.trim().lowercase()) {\n            "multicolor" -> "multicolor"\n            "gold" -> "gold"\n            "green" -> "green"\n            "blue" -> "blue"\n            "orange" -> "orange"\n            else -> "red"\n        }\n    }\n\n\n    val searchQuery'''
          new = '''    val normalizedTheme = remember(appTheme) { \n        when (appTheme.trim().lowercase()) {\n            "multicolor" -> "multicolor"\n            "gold" -> "gold"\n            "green" -> "green"\n            "blue" -> "blue"\n            "orange" -> "orange"\n            else -> "red"\n        }\n    }\n    val activeThemeBackground = remoteAppearance.activeBackgroundFor(normalizedTheme)\n\n\n    val searchQuery'''
          if old not in s:
              raise SystemExit('Tema normalizado da Home não encontrado')
          s = s.replace(old, new, 1)

          old = '''                ThemeBanner(\n                    appTheme = normalizedTheme,\n                    backgroundUrl = remoteAppearance.activeBackgroundFor(normalizedTheme)?.url,\n                    modifier = Modifier.fillMaxSize()\n                )'''
          new = '''                ThemeBanner(\n                    appTheme = normalizedTheme,\n                    backgroundUrl = activeThemeBackground?.url,\n                    imageScale = activeThemeBackground?.imageScale ?: 1f,\n                    imageOffsetX = activeThemeBackground?.imageOffsetX ?: 0f,\n                    imageOffsetY = activeThemeBackground?.imageOffsetY ?: 0f,\n                    modifier = Modifier.fillMaxSize()\n                )'''
          if old not in s:
              raise SystemExit('ThemeBanner da Home não encontrado')
          s = s.replace(old, new, 1)

          old = '''fun ThemeBanner(\n    appTheme: String,\n    backgroundUrl: String? = null,\n    modifier: Modifier = Modifier\n) {'''
          new = '''fun ThemeBanner(\n    appTheme: String,\n    backgroundUrl: String? = null,\n    imageScale: Float = 1f,\n    imageOffsetX: Float = 0f,\n    imageOffsetY: Float = 0f,\n    modifier: Modifier = Modifier\n) {'''
          if old not in s:
              raise SystemExit('Assinatura ThemeBanner não encontrada')
          s = s.replace(old, new, 1)

          old = '''    AsyncImage(\n        model = imageModel,\n        contentDescription = "Banner do tema $normalizedTheme",\n        modifier = modifier,\n        contentScale = ContentScale.FillWidth,\n        alignment = Alignment.TopCenter\n    )'''
          new = '''    BoxWithConstraints(modifier = modifier) {\n        val safeScale = imageScale.coerceIn(0.5f, 3f)\n        val safeOffsetX = imageOffsetX.coerceIn(-1f, 1f)\n        val safeOffsetY = imageOffsetY.coerceIn(-1f, 1f)\n        AsyncImage(\n            model = imageModel,\n            contentDescription = "Banner do tema $normalizedTheme",\n            modifier = Modifier\n                .fillMaxSize()\n                .offset(x = maxWidth * safeOffsetX, y = maxHeight * safeOffsetY)\n                .scale(safeScale),\n            contentScale = ContentScale.FillWidth,\n            alignment = Alignment.TopCenter\n        )\n    }'''
          if old not in s:
              raise SystemExit('Renderização ThemeBanner não encontrada')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 4) Preview interativo do Mestre com salvamento imediato
          p = Path('app/src/main/java/com/example/ui/MestreScreen.kt')
          s = p.read_text()
          old = '''            backgroundToPreview?.let { (themeKey, background) ->\n                androidx.compose.ui.window.Dialog(\n                    onDismissRequest = { backgroundToPreview = null }\n                ) {\n                    Surface(\n                        modifier = Modifier.fillMaxWidth(),\n                        shape = RoundedCornerShape(24.dp),\n                        color = MaterialTheme.colorScheme.surface\n                    ) {\n                        Column(modifier = Modifier.padding(16.dp)) {\n                            Text(\n                                "Prévia real na Home",\n                                style = MaterialTheme.typography.titleLarge,\n                                fontWeight = androidx.compose.ui.text.font.FontWeight.Bold\n                            )\n                            Spacer(modifier = Modifier.height(4.dp))\n                            Text(\n                                "${background.label} • ${themeOptions.find { it.first == themeKey }?.second ?: themeKey}",\n                                style = MaterialTheme.typography.bodySmall,\n                                color = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                            Spacer(modifier = Modifier.height(14.dp))\n                            androidx.compose.foundation.layout.BoxWithConstraints(\n                                modifier = Modifier.fillMaxWidth()\n                            ) {\n                                val previewHeight = maxWidth / 3f\n                                Box(\n                                    modifier = Modifier\n                                        .fillMaxWidth()\n                                        .height(previewHeight)\n                                        .clip(\n                                            RoundedCornerShape(\n                                                bottomStart = 32.dp,\n                                                bottomEnd = 32.dp\n                                            )\n                                        )\n                                        .background(Color.White)\n                                ) {\n                                    ThemeBanner(\n                                        appTheme = themeKey,\n                                        backgroundUrl = background.url,\n                                        modifier = Modifier.fillMaxSize()\n                                    )\n                                }\n                            }\n                            Spacer(modifier = Modifier.height(12.dp))\n                            Text(\n                                "Esta prévia usa o mesmo componente, proporção e recorte do banner exibido na Home. Nada é aplicado ao fechar esta janela.",\n                                style = MaterialTheme.typography.bodySmall,\n                                color = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                            Spacer(modifier = Modifier.height(8.dp))\n                            Button(\n                                onClick = { backgroundToPreview = null },\n                                modifier = Modifier.fillMaxWidth()\n                            ) {\n                                Text("Fechar prévia")\n                            }\n                        }\n                    }\n                }\n            }'''
          new = '''            backgroundToPreview?.let { (themeKey, background) ->\n                var previewScale by remember(background.id, background.imageScale) {\n                    mutableFloatStateOf(background.imageScale.coerceIn(0.5f, 3f))\n                }\n                var previewOffsetX by remember(background.id, background.imageOffsetX) {\n                    mutableFloatStateOf(background.imageOffsetX.coerceIn(-1f, 1f))\n                }\n                var previewOffsetY by remember(background.id, background.imageOffsetY) {\n                    mutableFloatStateOf(background.imageOffsetY.coerceIn(-1f, 1f))\n                }\n                androidx.compose.ui.window.Dialog(\n                    onDismissRequest = { backgroundToPreview = null }\n                ) {\n                    Surface(\n                        modifier = Modifier.fillMaxWidth(),\n                        shape = RoundedCornerShape(24.dp),\n                        color = MaterialTheme.colorScheme.surface\n                    ) {\n                        Column(\n                            modifier = Modifier\n                                .padding(16.dp)\n                                .verticalScroll(rememberScrollState())\n                        ) {\n                            Text(\n                                "Prévia real na Home",\n                                style = MaterialTheme.typography.titleLarge,\n                                fontWeight = androidx.compose.ui.text.font.FontWeight.Bold\n                            )\n                            Spacer(modifier = Modifier.height(4.dp))\n                            Text(\n                                "${background.label} • ${themeOptions.find { it.first == themeKey }?.second ?: themeKey}",\n                                style = MaterialTheme.typography.bodySmall,\n                                color = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                            Spacer(modifier = Modifier.height(14.dp))\n                            androidx.compose.foundation.layout.BoxWithConstraints(\n                                modifier = Modifier.fillMaxWidth()\n                            ) {\n                                val previewHeight = maxWidth / 3f\n                                Box(\n                                    modifier = Modifier\n                                        .fillMaxWidth()\n                                        .height(previewHeight)\n                                        .clip(\n                                            RoundedCornerShape(\n                                                bottomStart = 32.dp,\n                                                bottomEnd = 32.dp\n                                            )\n                                        )\n                                        .background(Color.White)\n                                ) {\n                                    ThemeBanner(\n                                        appTheme = themeKey,\n                                        backgroundUrl = background.url,\n                                        imageScale = previewScale,\n                                        imageOffsetX = previewOffsetX,\n                                        imageOffsetY = previewOffsetY,\n                                        modifier = Modifier.fillMaxSize()\n                                    )\n                                }\n                            }\n                            Spacer(modifier = Modifier.height(12.dp))\n                            Text("Zoom: ${(previewScale * 100).toInt()}%", style = MaterialTheme.typography.labelLarge)\n                            Slider(\n                                value = previewScale,\n                                onValueChange = { previewScale = it },\n                                valueRange = 0.5f..3f\n                            )\n                            Text("Horizontal: ${(previewOffsetX * 100).toInt()}", style = MaterialTheme.typography.labelLarge)\n                            Slider(\n                                value = previewOffsetX,\n                                onValueChange = { previewOffsetX = it },\n                                valueRange = -1f..1f\n                            )\n                            Text("Vertical: ${(previewOffsetY * 100).toInt()}", style = MaterialTheme.typography.labelLarge)\n                            Slider(\n                                value = previewOffsetY,\n                                onValueChange = { previewOffsetY = it },\n                                valueRange = -1f..1f\n                            )\n                            TextButton(\n                                onClick = {\n                                    previewScale = 1f\n                                    previewOffsetX = 0f\n                                    previewOffsetY = 0f\n                                },\n                                modifier = Modifier.align(Alignment.End)\n                            ) {\n                                Text("Restaurar enquadramento")\n                            }\n                            Text(\n                                "O ajuste acima será usado exatamente na Home. A imagem original não é alterada.",\n                                style = MaterialTheme.typography.bodySmall,\n                                color = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                            Spacer(modifier = Modifier.height(10.dp))\n                            Button(\n                                onClick = {\n                                    val updatedBackgrounds = draftThemeBackgrounds + (\n                                        themeKey to draftThemeBackgrounds[themeKey].orEmpty().map { item ->\n                                            if (item.id == background.id) {\n                                                item.copy(\n                                                    imageScale = previewScale,\n                                                    imageOffsetX = previewOffsetX,\n                                                    imageOffsetY = previewOffsetY\n                                                )\n                                            } else item\n                                        }\n                                    )\n                                    draftThemeBackgrounds = updatedBackgrounds\n                                    val settingsToSave = draftAppearanceSettings.copy(themeBackgrounds = updatedBackgrounds)\n                                    coroutineScope.launch {\n                                        isSavingAppearanceSettings = true\n                                        val saved = FirebaseService.saveAppearanceSettings(settingsToSave)\n                                        isSavingAppearanceSettings = false\n                                        if (saved) {\n                                            backgroundToPreview = null\n                                            snackbarHostState.showSnackbar("Prévia salva. Este enquadramento será usado na Home.")\n                                        } else {\n                                            snackbarHostState.showSnackbar(\n                                                FirebaseService.lastError ?: "Não foi possível salvar a prévia."\n                                            )\n                                        }\n                                    }\n                                },\n                                modifier = Modifier.fillMaxWidth(),\n                                enabled = !isSavingAppearanceSettings\n                            ) {\n                                if (isSavingAppearanceSettings) {\n                                    CircularProgressIndicator(\n                                        modifier = Modifier.size(20.dp),\n                                        color = MaterialTheme.colorScheme.onPrimary,\n                                        strokeWidth = 2.dp\n                                    )\n                                    Spacer(modifier = Modifier.width(8.dp))\n                                    Text("Salvando prévia...")\n                                } else {\n                                    Text("Salvar Prévia")\n                                }\n                            }\n                            Spacer(modifier = Modifier.height(8.dp))\n                            OutlinedButton(\n                                onClick = { backgroundToPreview = null },\n                                modifier = Modifier.fillMaxWidth(),\n                                enabled = !isSavingAppearanceSettings\n                            ) {\n                                Text("Fechar prévia")\n                            }\n                        }\n                    }\n                }\n            }'''
          if old not in s:
              raise SystemExit('Bloco atual de preview não encontrado')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/ThemeBackground.kt \
                  app/src/main/java/com/example/data/FirebaseService.kt \
                  app/src/main/java/com/example/ui/SearchScreen.kt \
                  app/src/main/java/com/example/ui/MestreScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Permite ajustar e salvar enquadramento dos fundos"
          git push
