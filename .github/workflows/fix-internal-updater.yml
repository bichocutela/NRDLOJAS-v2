name: Corrigir Atualizador Interno

on:
  push:
    paths:
      - '.github/workflows/fix-internal-updater.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar fluxo interno
        run: python3 tools/fix_internal_updater.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AboutScreen.kt app/src/main/java/com/example/util/UpdateChecker.kt
          git commit -m "Restaura atualização interna sem abrir GitHub"
          git push
