name: Validate Banners before Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/themes/theme_red.jpg'
      - 'app/src/main/assets/themes/theme_gold.jpg'
      - 'app/src/main/assets/themes/theme_green.jpg'
      - 'app/src/main/assets/themes/theme_blue.jpg'
      - 'app/src/main/assets/themes/theme_orange.jpg'
      - '.github/workflows/validate_banners.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/themes/theme_red.jpg'
      - 'app/src/main/assets/themes/theme_gold.jpg'
      - 'app/src/main/assets/themes/theme_green.jpg'
      - 'app/src/main/assets/themes/theme_blue.jpg'
      - 'app/src/main/assets/themes/theme_orange.jpg'
      - '.github/workflows/validate_banners.yml'
  workflow_dispatch:

concurrency:
  group: validate-banners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate JPEG Banners
      run: |
        python - <<'PY'
        from pathlib import Path

        files = [
            "theme_red.jpg",
            "theme_gold.jpg",
            "theme_green.jpg",
            "theme_blue.jpg",
            "theme_orange.jpg",
        ]

        base = Path("app/src/main/assets/themes")

        for name in files:
            path = base / name
            if not path.exists():
                raise SystemExit(f"Arquivo ausente: {path}")

            data = path.read_bytes()

            if len(data) == 0:
                raise SystemExit(f"Arquivo vazio: {path}")

            if not data.startswith(b"\xFF\xD8\xFF"):
                raise SystemExit(f"JPEG inválido/corrompido: {path}")

            print(f"OK: {path} ({len(data)} bytes)")
        PY
