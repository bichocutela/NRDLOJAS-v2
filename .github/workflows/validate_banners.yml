name: Validate Banners before Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/themes/theme_red.jpg'
      - 'app/src/main/assets/themes/theme_gold.jpg'
      - 'app/src/main/assets/themes/theme_green.jpg'
      - 'app/src/main/assets/themes/theme_blue.jpg'
      - 'app/src/main/assets/themes/theme_orange.jpg'
      - 'app/src/main/res/drawable-nodpi/hero_banner.png'
      - '.github/workflows/validate_banners.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/themes/theme_red.jpg'
      - 'app/src/main/assets/themes/theme_gold.jpg'
      - 'app/src/main/assets/themes/theme_green.jpg'
      - 'app/src/main/assets/themes/theme_blue.jpg'
      - 'app/src/main/assets/themes/theme_orange.jpg'
      - 'app/src/main/res/drawable-nodpi/hero_banner.png'
      - '.github/workflows/validate_banners.yml'
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Validate JPEG Banners
      run: |
        python - <<'PY'
        from pathlib import Path

        files = [
            "theme_red.jpg",
            "theme_gold.jpg",
            "theme_green.jpg",
            "theme_blue.jpg",
            "theme_orange.jpg",
        ]

        base = Path("app/src/main/assets/themes")

        for name in files:
            path = base / name
            if not path.exists():
                raise SystemExit(f"Arquivo ausente: {path}")

            data = path.read_bytes()

            if len(data) == 0:
                raise SystemExit(f"Arquivo vazio: {path}")

            if not data.startswith(b"\xFF\xD8\xFF"):
                raise SystemExit(f"JPEG inválido/corrompido: {path}")

            print(f"OK: {path} ({len(data)} bytes)")
        PY

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate ephemeral debug keystore
      run: |
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android \
          -keypass android \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Grant execute permission for gradlew
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar && gradle wrapper
        chmod +x gradlew
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Validate APK Contents
      run: |
        unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/themes/"
        for theme in theme_red.jpg theme_gold.jpg theme_green.jpg theme_blue.jpg theme_orange.jpg; do
            if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/themes/$theme"; then
                echo "Missing $theme in APK!"
                exit 1
            fi
        done
        echo "All themes present in APK."
