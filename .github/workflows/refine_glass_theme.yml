name: Refinar Glass e drawer

on:
  push:
    paths:
      - '.github/workflows/refine_glass_theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refinar Glass
        shell: python
        run: |
          from pathlib import Path

          # SearchScreen: vertical gradient + dark glass tinted by selected accent.
          p = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.graphics.luminance' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Brush\n', 'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.luminance\n', 1)

          old = '''    val glassBackgroundBrush = remember(glassAccentPalette) {\n        Brush.linearGradient(\n            colors = listOf(Color.White) + glassAccentPalette.map { it.copy(alpha = 0.24f) } + listOf(Color.White)\n        )\n    }\n'''
          new = '''    val isDarkGlass = MaterialTheme.colorScheme.background.luminance() < 0.35f\n    val glassBackgroundBrush = remember(glassAccentPalette, isDarkGlass) {\n        val base = if (isDarkGlass) Color(0xFF0C0F14) else Color.White\n        val accent = glassAccentPalette.first()\n        Brush.verticalGradient(\n            colors = if (isDarkGlass) {\n                listOf(\n                    base,\n                    accent.copy(alpha = 0.34f),\n                    base.copy(alpha = 0.96f)\n                )\n            } else {\n                listOf(\n                    accent.copy(alpha = 0.22f),\n                    Color.White.copy(alpha = 0.96f),\n                    accent.copy(alpha = 0.12f)\n                )\n            }\n        )\n    }\n'''
          if old not in s:
              raise SystemExit('search background block missing')
          s = s.replace(old, new, 1)

          old = '''                    .background(if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else Color.White)\n'''
          new = '''                    .background(\n                        if (isGlassTheme) {\n                            val tint = glassAccentPalette.first()\n                            if (isDarkGlass) tint.copy(alpha = (glassSurfaceAlpha * 0.46f).coerceAtLeast(0.12f))\n                            else Color.White.copy(alpha = glassSurfaceAlpha)\n                        } else Color.White\n                    )\n'''
          if old in s:
              s = s.replace(old, new, 1)

          # Bottom sheets: use selected Glass tint and dark surfaces.
          old_expr = 'if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else MaterialTheme.colorScheme.surfaceContainerLow'
          new_expr = '''if (isGlassTheme) {\n                    val tint = glassAccentPalette.first()\n                    if (isDarkGlass) tint.copy(alpha = (glassSurfaceAlpha * 0.50f).coerceAtLeast(0.14f))\n                    else tint.copy(alpha = (glassSurfaceAlpha * 0.28f).coerceAtLeast(0.08f))\n                } else MaterialTheme.colorScheme.surfaceContainerLow'''
          count = s.count(old_expr)
          if count < 3:
              raise SystemExit(f'expected >=3 sheet expressions, got {count}')
          s = s.replace(old_expr, new_expr, 3)

          # Shared card glass style: tint based on chosen Glass accent and dark mode.
          old = '''    val type by viewModel.userPreferences.glassType.collectAsStateWithLifecycle(initialValue = "soft")\n    val baseAlpha = (1f - transparency).coerceIn(0.10f, 0.80f)\n'''
          new = '''    val type by viewModel.userPreferences.glassType.collectAsStateWithLifecycle(initialValue = "soft")\n    val accentName by viewModel.userPreferences.glassAccentColor.collectAsStateWithLifecycle(initialValue = "multicolor")\n    val darkGlass = MaterialTheme.colorScheme.background.luminance() < 0.35f\n    val accent = remember(accentName) {\n        when (accentName) {\n            "red" -> Color(0xFFE5252A)\n            "green" -> Color(0xFF2E9D44)\n            "orange" -> Color(0xFFF28C18)\n            "blue" -> Color(0xFF2474D2)\n            "gold" -> Color(0xFFC99A14)\n            else -> listOf(Color(0xFFE5252A), Color(0xFF2E9D44), Color(0xFFF28C18), Color(0xFF2474D2), Color(0xFFC99A14)).shuffled().first()\n        }\n    }\n    val baseAlpha = (1f - transparency).coerceIn(0.10f, 0.80f)\n'''
          if old not in s:
              raise SystemExit('shared glass prefs block missing')
          s = s.replace(old, new, 1)

          old = '''    val fill = when (type) {\n        "frosted" -> Color(0xFFF7FAFC)\n        "crystal" -> Color.White\n        else -> Color(0xFFFBFDFF)\n    }\n'''
          new = '''    val fill = if (darkGlass) {\n        when (type) {\n            "frosted" -> accent.copy(alpha = 0.62f)\n            "crystal" -> accent.copy(alpha = 0.34f)\n            else -> accent.copy(alpha = 0.48f)\n        }\n    } else {\n        when (type) {\n            "frosted" -> accent.copy(alpha = 0.22f)\n            "crystal" -> accent.copy(alpha = 0.12f)\n            else -> accent.copy(alpha = 0.17f)\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('shared glass fill block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Drawer: remove rainbow gradient in Multicolor; choose one session accent.
          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.graphics.luminance' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.luminance\n', 1)

          old = '''    val drawerAccentColors = if (isGlassTheme) glassSessionColors else multicolorSessionColors\n    val multicolorBrush = remember(drawerAccentColors) { Brush.horizontalGradient(drawerAccentColors) }\n    val useGradientDrawer = isMulticolorTheme || isGlassTheme\n'''
          new = '''    val drawerAccentColors = if (isGlassTheme) glassSessionColors else multicolorSessionColors\n    val sessionAccent = remember(multicolorSessionColors) { multicolorSessionColors.first() }\n    val glassAccent = remember(glassSessionColors) { glassSessionColors.first() }\n    val drawerAccent = if (isGlassTheme) glassAccent else sessionAccent\n    val useGradientDrawer = false\n    val isDarkGlass = MaterialTheme.colorScheme.background.luminance() < 0.35f\n'''
          if old not in s:
              raise SystemExit('drawer accent block missing')
          s = s.replace(old, new, 1)

          old = '''    val drawerGlassBrush = remember(drawerAccentColors) {\n        Brush.verticalGradient(listOf(Color.White) + drawerAccentColors.map { it.copy(alpha = 0.16f) } + listOf(Color.White))\n    }\n'''
          new = '''    val drawerGlassBrush = remember(drawerAccent, isDarkGlass) {\n        Brush.verticalGradient(\n            if (isDarkGlass) {\n                listOf(\n                    Color(0xFF0C0F14),\n                    drawerAccent.copy(alpha = 0.38f),\n                    Color(0xFF11151B)\n                )\n            } else {\n                listOf(\n                    drawerAccent.copy(alpha = 0.18f),\n                    Color.White.copy(alpha = 0.94f),\n                    drawerAccent.copy(alpha = 0.10f)\n                )\n            }\n        )\n    }\n'''
          if old not in s:
              raise SystemExit('drawer glass brush missing')
          s = s.replace(old, new, 1)

          # Primary drawer texts/buttons: Multicolor becomes one session color, Glass uses selected/session accent.
          s = s.replace('color = if (useGradientDrawer) Color.Unspecified else MaterialTheme.colorScheme.primary', 'color = if (isMulticolorTheme || isGlassTheme) drawerAccent else MaterialTheme.colorScheme.primary')
          # Any explicit rainbow brush backgrounds should become single accent for multicolor/glass drawer buttons.
          s = s.replace('.background(multicolorBrush, RoundedCornerShape(24.dp))', '.background(drawerAccent, RoundedCornerShape(24.dp))')
          s = s.replace('MaterialTheme.typography.headlineMedium.merge(TextStyle(brush = multicolorBrush))', 'MaterialTheme.typography.headlineMedium')
          s = s.replace('MaterialTheme.typography.titleMedium.merge(TextStyle(brush = multicolorBrush))', 'MaterialTheme.typography.titleMedium')
          p.write_text(s)

          # Product dialog: dark Glass tinted by selected accent.
          p = Path('app/src/main/java/com/example/ui/ProductBarcodeDialog.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.graphics.luminance' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.luminance\n', 1)
          old = '''    val glassType by userPreferences.glassType.collectAsState(initial = "soft")\n    val isGlassTheme = appTheme == "glass"\n'''
          new = '''    val glassType by userPreferences.glassType.collectAsState(initial = "soft")\n    val glassAccentName by userPreferences.glassAccentColor.collectAsState(initial = "multicolor")\n    val isGlassTheme = appTheme == "glass"\n    val darkGlass = MaterialTheme.colorScheme.background.luminance() < 0.35f\n    val glassAccent = remember(glassAccentName) {\n        when (glassAccentName) {\n            "red" -> Color(0xFFE5252A)\n            "green" -> Color(0xFF2E9D44)\n            "orange" -> Color(0xFFF28C18)\n            "blue" -> Color(0xFF2474D2)\n            "gold" -> Color(0xFFC99A14)\n            else -> listOf(Color(0xFFE5252A), Color(0xFF2E9D44), Color(0xFFF28C18), Color(0xFF2474D2), Color(0xFFC99A14)).shuffled().first()\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('dialog accent anchor missing')
          s = s.replace(old, new, 1)
          old = '''    val glassDialogColor = when (glassType) {\n        "frosted" -> Color(0xFFF7FAFC).copy(alpha = glassDialogAlpha)\n        "crystal" -> Color.White.copy(alpha = glassDialogAlpha)\n        else -> Color(0xFFFBFDFF).copy(alpha = glassDialogAlpha)\n    }\n'''
          new = '''    val glassDialogColor = if (darkGlass) {\n        glassAccent.copy(alpha = (glassDialogAlpha * 0.62f).coerceAtLeast(0.14f))\n    } else {\n        glassAccent.copy(alpha = (glassDialogAlpha * 0.28f).coerceAtLeast(0.08f))\n    }\n'''
          if old not in s:
              raise SystemExit('dialog color block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/SearchScreen.kt app/src/main/java/com/example/ui/AppNavGraph.kt app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          git commit -m "Refina Glass no escuro e restaura drawer multicolorido"
          git push
