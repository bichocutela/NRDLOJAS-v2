name: Corrigir configurações do usuário uma vez

on:
  push:
    paths:
      - '.github/workflows/patch-user-settings-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aplicar correções
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          prefs = Path('app/src/main/java/com/example/data/UserPreferences.kt')
          text = prefs.read_text()
          old = '''    val appTheme: Flow<String> = context.dataStore.data.map { preferences ->
              preferences[APP_THEME] ?: "multicolor"
          }

          val appearanceMode: Flow<String> = context.dataStore.data.map { preferences ->
              preferences[APPEARANCE_MODE] ?: "system"
          }
          '''
          new = '''    val appTheme: Flow<String> = context.dataStore.data.map { preferences ->
              preferences[APP_THEME] ?: "multicolor"
          }
          val appThemeWasChosen: Flow<Boolean> = context.dataStore.data.map { preferences ->
              preferences[APP_THEME] != null
          }

          val appearanceMode: Flow<String> = context.dataStore.data.map { preferences ->
              preferences[APPEARANCE_MODE] ?: "system"
          }
          val appearanceModeWasChosen: Flow<Boolean> = context.dataStore.data.map { preferences ->
              preferences[APPEARANCE_MODE] != null
          }
          '''
          if old not in text:
              raise SystemExit('Preferências de tema não encontradas')
          prefs.write_text(text.replace(old, new, 1))

          main = Path('app/src/main/java/com/example/MainActivity.kt')
          text = main.read_text()
          text = text.replace('import com.example.data.dataStore\n', '')
          text = text.replace('import kotlinx.coroutines.flow.map\n', '')
          old = '''            val fontScale by userPreferences.fontScale.collectAsState(initial = 1.0f)
              val appTheme by userPreferences.appTheme.collectAsState(initial = "multicolor")
          '''
          new = '''            val fontScale by userPreferences.fontScale.collectAsState(initial = 1.0f)
              val largeText by userPreferences.largeText.collectAsState(initial = false)
              val appTheme by userPreferences.appTheme.collectAsState(initial = "multicolor")
          '''
          if old not in text:
              raise SystemExit('Escala de fonte não encontrada')
          text = text.replace(old, new, 1)
          old = '''            val hasLocalThemeChoice by applicationContext.dataStore.data
                  .map { preferences -> preferences[UserPreferences.APP_THEME] != null }
                  .collectAsState(initial = false)
              val hasLocalAppearanceChoice by applicationContext.dataStore.data
                  .map { preferences -> preferences[UserPreferences.APPEARANCE_MODE] != null }
                  .collectAsState(initial = false)
          '''
          new = '''            val hasLocalThemeChoice by userPreferences.appThemeWasChosen.collectAsState(initial = false)
              val hasLocalAppearanceChoice by userPreferences.appearanceModeWasChosen.collectAsState(initial = false)
          '''
          if old not in text:
              raise SystemExit('Precedência local não encontrada')
          text = text.replace(old, new, 1)
          old = '                fontScale = currentDensity.fontScale * fontScale\n'
          new = '                fontScale = currentDensity.fontScale * fontScale * if (largeText) 1.15f else 1.0f\n'
          if old not in text:
              raise SystemExit('Density não encontrada')
          main.write_text(text.replace(old, new, 1))

          search = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          text = search.read_text()
          old = '''    val localAppTheme by viewModel.userPreferences.appTheme.collectAsStateWithLifecycle(initialValue = "multicolor")
              val remoteAppearance by FirebaseService.observeAppearanceSettings()
                  .collectAsStateWithLifecycle(initialValue = AppearanceSettings())
              val appTheme = if (remoteAppearance.overrideLocalTheme) remoteAppearance.theme else localAppTheme
          '''
          new = '''    val localAppTheme by viewModel.userPreferences.appTheme.collectAsStateWithLifecycle(initialValue = "multicolor")
              val localThemeWasChosen by viewModel.userPreferences.appThemeWasChosen.collectAsStateWithLifecycle(initialValue = false)
              val remoteAppearance by FirebaseService.observeAppearanceSettings()
                  .collectAsStateWithLifecycle(initialValue = AppearanceSettings())
              val appTheme = if (remoteAppearance.overrideLocalTheme && !localThemeWasChosen) remoteAppearance.theme else localAppTheme
          '''
          if old not in text:
              raise SystemExit('Tema da Home não encontrado')
          search.write_text(text.replace(old, new, 1))

          settings = Path('app/src/main/java/com/example/ui/SettingsScreen.kt')
          text = settings.read_text()
          old = 'Text("Aumentar letras da tela inicial")'
          if old not in text:
              raise SystemExit('Rótulo largeText não encontrado')
          settings.write_text(text.replace(old, 'Text("Aumentar letras do aplicativo")', 1))

          Path('.github/workflows/patch-user-settings-once.yml').unlink()
          PY
      - name: Commit das correções
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige preferências locais de aparência e texto"
          git push
