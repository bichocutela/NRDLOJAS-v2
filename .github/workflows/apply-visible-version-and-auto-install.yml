name: Apply visible drawer version and auto install fix
on:
  push:
    paths:
      - '.github/workflows/apply-visible-version-and-auto-install.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch drawer and updater
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()
          old = '''        Button(onClick = onGoToAbout, modifier = Modifier.fillMaxWidth().height(46.dp)) { Text("Sobre") }
        Spacer(modifier = Modifier.height(10.dp))
        Text(
            text = "Versão instalada: v${com.example.BuildConfig.VERSION_NAME}",
            style = MaterialTheme.typography.labelLarge,
            fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold,
            color = MaterialTheme.colorScheme.onSurface,
            modifier = Modifier
                .fillMaxWidth()
                .padding(vertical = 2.dp),
            textAlign = androidx.compose.ui.text.style.TextAlign.Center
        )
        if (drawerUpdateAvailable) {
            Spacer(modifier = Modifier.height(6.dp))
            Button(
                onClick = onGoToAbout,
                modifier = Modifier.fillMaxWidth().height(42.dp)
            ) {
                Text("Existe Atualização", style = MaterialTheme.typography.labelLarge)
            }
        }'''
          new = '''        Button(onClick = onGoToAbout, modifier = Modifier.fillMaxWidth().height(46.dp)) { Text("Sobre") }
        Spacer(modifier = Modifier.height(8.dp))
        Surface(
            modifier = Modifier.fillMaxWidth(),
            shape = RoundedCornerShape(14.dp),
            color = MaterialTheme.colorScheme.surfaceVariant,
            contentColor = MaterialTheme.colorScheme.onSurfaceVariant
        ) {
            Column(
                modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 10.dp),
                horizontalAlignment = Alignment.CenterHorizontally
            ) {
                Text(
                    text = "Versão instalada: v${com.example.BuildConfig.VERSION_NAME}",
                    style = MaterialTheme.typography.titleSmall,
                    fontWeight = androidx.compose.ui.text.font.FontWeight.Bold,
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )
                if (drawerUpdateAvailable) {
                    Spacer(modifier = Modifier.height(8.dp))
                    Button(
                        onClick = onGoToAbout,
                        modifier = Modifier.fillMaxWidth().height(40.dp)
                    ) {
                        Text("Existe Atualização", fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)
                    }
                }
            }
        }'''
          if old not in s:
              raise SystemExit('drawer version block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/src/main/java/com/example/util/UpdateChecker.kt')
          s = p.read_text()
          old = '''            ApkDownloadHandle(manager.enqueue(request), file.absolutePath)
        } catch (e: Exception) {'''
          new = '''            val downloadId = manager.enqueue(request)
            val handle = ApkDownloadHandle(downloadId, file.absolutePath)
            val onComplete = object : BroadcastReceiver() {
                override fun onReceive(ctxt: Context, intent: Intent) {
                    val completedId = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L)
                    if (completedId != downloadId) return
                    try {
                        val state = queryApkDownload(ctxt, handle)
                        if (state?.status == DownloadManager.STATUS_SUCCESSFUL) {
                            installApk(ctxt, File(handle.filePath))
                        }
                    } catch (e: Exception) {
                        Log.e(TAG, "Falha ao abrir instalador automaticamente", e)
                    } finally {
                        runCatching { ctxt.unregisterReceiver(this) }
                    }
                }
            }
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                context.registerReceiver(onComplete, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED)
            } else {
                @Suppress("UnspecifiedRegisterReceiverFlag")
                context.registerReceiver(onComplete, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE))
            }
            handle
        } catch (e: Exception) {'''
          if old not in s:
              raise SystemExit('startApkDownload block not found')
          s = s.replace(old, new, 1)
          s = s.replace('DownloadManager.Request.VISIBILITY_VISIBLE)\n                .setDestinationInExternalFilesDir', 'DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)\n                .setDestinationInExternalFilesDir', 1)
          p.write_text(s)

          p = Path('app/src/main/java/com/example/ui/AboutScreen.kt')
          s = p.read_text()
          s = s.replace('''                                updateDownloadHandle = null
                                com.example.util.UpdateChecker.installDownloadedApk(context, state.filePath)
                                break''', '''                                updateDownloadHandle = null
                                break''', 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt app/src/main/java/com/example/util/UpdateChecker.kt app/src/main/java/com/example/ui/AboutScreen.kt
          git commit -m "fix: show installed version below About and auto-open installer"
          git push