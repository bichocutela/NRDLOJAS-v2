name: Ajustar bloqueio final do preview

on:
  push:
    paths:
      - '.github/workflows/lock_preview_reset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bloquear restauração quando cadeado estiver fechado
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/MestreScreen.kt')
          s = p.read_text()
          old = '''                                modifier = Modifier.align(Alignment.End)\n                            ) {\n                                Text("Restaurar enquadramento")\n'''
          new = '''                                modifier = Modifier.align(Alignment.End),\n                                enabled = previewUnlocked\n                            ) {\n                                Text("Restaurar enquadramento")\n'''
          if old not in s:
              raise SystemExit('Botão Restaurar enquadramento não encontrado')
          p.write_text(s.replace(old, new, 1))
      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/MestreScreen.kt
          git commit -m "Fecha todos os ajustes com o cadeado do preview"
          git push
