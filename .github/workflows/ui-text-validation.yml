name: UI text checks

on:
  push:
    branches: [fix/remove-acp-labels-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Compile app
        run: bash gradlew compileDebugKotlin -x processDebugGoogleServices
