name: Compactar configurações

on:
  push:
    branches: ["compact-settings-layout"]
    paths:
      - ".github/workflows/compact-settings-layout.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compactar espaçamentos
        run: python3 .github/data-jobs/compact-settings-layout.py

      - name: Conferir alteração
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/SettingsScreen.kt
          git commit -m "Compacta layout das configurações"
          git push
