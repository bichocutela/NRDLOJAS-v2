name: Aplicar atalho Alterar Código

on:
  push:
    branches:
      - feature/master-change-code-shortcut

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-change-code-shortcut
          fetch-depth: 0

      - name: Aplicar alteração funcional
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ProductBarcodeDialog.kt')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'âncora não encontrada em ProductBarcodeDialog: {old[:120]!r}')
              s = s.replace(old, new, count)

          rep(
              'import androidx.compose.foundation.text.selection.SelectionContainer\n',
              'import androidx.compose.foundation.text.selection.SelectionContainer\nimport androidx.compose.foundation.text.KeyboardOptions\n'
          )
          rep(
              'import androidx.compose.ui.text.style.TextOverflow\n',
              'import androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.text.input.KeyboardType\n'
          )
          rep(
              '''    highlightedFromNotification: Boolean = false,\n    onProductUpdated: (Product) -> Unit = {}\n) {''',
              '''    highlightedFromNotification: Boolean = false,\n    onProductUpdated: (Product) -> Unit = {},\n    onProductCodeChanged: (suspend (Product, String) -> Boolean)? = null\n) {'''
          )
          rep(
              '''    var pendingPhotoUrl by remember(product.code) { mutableStateOf<String?>(null) }\n''',
              '''    var pendingPhotoUrl by remember(product.code) { mutableStateOf<String?>(null) }\n    var showCodeEditDialog by remember { mutableStateOf(false) }\n    var codeEditValue by remember(product.code) { mutableStateOf(product.code) }\n    var isCodeSaving by remember { mutableStateOf(false) }\n    var codeEditMessage by remember(product.code) { mutableStateOf<String?>(null) }\n'''
          )

          old_actions = '''                            if (photoUrl != null || isMaster) {\n                                Spacer(modifier = Modifier.weight(1f))\n                                TextButton(\n                                    onClick = { showPhotoDialog = true },\n                                    contentPadding = PaddingValues(horizontal = 4.dp)\n                                ) {\n                                    Text(\n                                        if (photoUrl != null) "Ver Foto do Produto" else "Adicionar Foto",\n                                        maxLines = 2,\n                                        textAlign = TextAlign.End\n                                    )\n                                }\n                            }\n'''
          new_actions = '''                            Spacer(modifier = Modifier.weight(1f))\n                            if (isMaster && onProductCodeChanged != null) {\n                                TextButton(\n                                    onClick = {\n                                        codeEditValue = product.code\n                                        codeEditMessage = null\n                                        showCodeEditDialog = true\n                                    },\n                                    contentPadding = PaddingValues(horizontal = 4.dp)\n                                ) {\n                                    Text(\n                                        "Alterar Código",\n                                        maxLines = 2,\n                                        fontSize = 12.sp,\n                                        textAlign = TextAlign.End\n                                    )\n                                }\n                            }\n                            if (photoUrl != null || isMaster) {\n                                TextButton(\n                                    onClick = { showPhotoDialog = true },\n                                    contentPadding = PaddingValues(horizontal = 4.dp)\n                                ) {\n                                    Text(\n                                        if (photoUrl != null) "Ver Foto do Produto" else "Adicionar Foto",\n                                        maxLines = 2,\n                                        fontSize = 12.sp,\n                                        textAlign = TextAlign.End\n                                    )\n                                }\n                            }\n'''
          rep(old_actions, new_actions)

          anchor = '''        if (showPhotoDialog && (photoUrl != null || isMaster)) {\n'''
          code_dialog = '''        if (showCodeEditDialog && isMaster && onProductCodeChanged != null) {\n            AlertDialog(\n                onDismissRequest = {\n                    if (!isCodeSaving) {\n                        codeEditMessage = null\n                        showCodeEditDialog = false\n                    }\n                },\n                title = { Text("Alterar Código") },\n                text = {\n                    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                        Text(\n                            product.name,\n                            style = MaterialTheme.typography.titleMedium,\n                            fontWeight = FontWeight.Bold\n                        )\n                        Text(\n                            "Código atual: ${product.code}",\n                            style = MaterialTheme.typography.bodySmall,\n                            color = MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                        OutlinedTextField(\n                            value = codeEditValue,\n                            onValueChange = { codeEditValue = it },\n                            label = { Text("Novo Código") },\n                            singleLine = true,\n                            keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                            enabled = !isCodeSaving,\n                            modifier = Modifier.fillMaxWidth()\n                        )\n                        codeEditMessage?.let { message ->\n                            Text(\n                                message,\n                                style = MaterialTheme.typography.bodySmall,\n                                color = MaterialTheme.colorScheme.error\n                            )\n                        }\n                    }\n                },\n                confirmButton = {\n                    TextButton(\n                        onClick = {\n                            val newCode = codeEditValue.trim()\n                            when {\n                                newCode.isBlank() -> codeEditMessage = "Informe o novo código."\n                                newCode == product.code -> codeEditMessage = "Digite um código diferente do atual."\n                                else -> coroutineScope.launch {\n                                    isCodeSaving = true\n                                    codeEditMessage = null\n                                    try {\n                                        val changed = onProductCodeChanged(product, newCode)\n                                        if (changed) {\n                                            onProductUpdated(product.copy(code = newCode))\n                                            showCodeEditDialog = false\n                                        } else {\n                                            codeEditMessage = "Não foi possível alterar o código."\n                                        }\n                                    } catch (_: Exception) {\n                                        codeEditMessage = "Não foi possível alterar o código. Tente novamente."\n                                    } finally {\n                                        isCodeSaving = false\n                                    }\n                                }\n                            }\n                        },\n                        enabled = !isCodeSaving\n                    ) {\n                        if (isCodeSaving) {\n                            CircularProgressIndicator(modifier = Modifier.size(18.dp), strokeWidth = 2.dp)\n                            Spacer(modifier = Modifier.width(6.dp))\n                        }\n                        Text(if (isCodeSaving) "Salvando..." else "Salvar")\n                    }\n                },\n                dismissButton = {\n                    TextButton(\n                        onClick = { showCodeEditDialog = false },\n                        enabled = !isCodeSaving\n                    ) {\n                        Text("Cancelar")\n                    }\n                }\n            )\n        }\n\n'''
          rep(anchor, code_dialog + anchor)
          p.write_text(s)

          p = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          s = p.read_text()

          simple = 'ProductBarcodeDialog(product = product, onDismiss = { showDialog = false })'
          wired = '''ProductBarcodeDialog(\n            product = product,\n            onDismiss = { showDialog = false },\n            onProductUpdated = { updated -> viewModel.updateProductLocally(updated) },\n            onProductCodeChanged = { old, newCode ->\n                viewModel.updateProductSuspend(old, old.copy(code = newCode))\n            }\n        )'''
          count = s.count(simple)
          if count < 3:
              raise SystemExit(f'esperava ao menos 3 dialogs simples em SearchScreen, encontrei {count}')
          s = s.replace(simple, wired)

          old_notif = '''                onProductUpdated = { updated ->\n                    selectedNotificationProduct = updated\n                    viewModel.updateProductLocally(updated)\n                }\n            )'''
          new_notif = '''                onProductUpdated = { updated ->\n                    selectedNotificationProduct = updated\n                    viewModel.updateProductLocally(updated)\n                },\n                onProductCodeChanged = { old, newCode ->\n                    viewModel.updateProductSuspend(old, old.copy(code = newCode))\n                }\n            )'''
          if old_notif not in s:
              raise SystemExit('dialog de notificação não encontrado')
          s = s.replace(old_notif, new_notif, 1)

          old_most = '''                onProductUpdated = { updated ->\n                    selectedMostUsedProduct = updated\n                    viewModel.updateProductLocally(updated)\n                }\n            )'''
          new_most = '''                onProductUpdated = { updated ->\n                    selectedMostUsedProduct = updated\n                    viewModel.updateProductLocally(updated)\n                },\n                onProductCodeChanged = { old, newCode ->\n                    viewModel.updateProductSuspend(old, old.copy(code = newCode))\n                }\n            )'''
          if old_most not in s:
              raise SystemExit('dialog de mais utilizados não encontrado')
          s = s.replace(old_most, new_most, 1)
          p.write_text(s)
          PY

      - name: Validar diff
        run: |
          git diff --check
          grep -q 'Alterar Código' app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          grep -q 'onProductCodeChanged' app/src/main/java/com/example/ui/SearchScreen.kt

      - name: Compilar Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Remover workflow temporário e commitar
        run: |
          rm .github/workflows/patch-master-change-code.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt app/src/main/java/com/example/ui/SearchScreen.kt .github/workflows/patch-master-change-code.yml
          git commit -m "Adiciona atalho mestre para alterar código do produto"
          git push origin HEAD:feature/master-change-code-shortcut
