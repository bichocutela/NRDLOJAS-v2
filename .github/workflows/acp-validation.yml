name: ACP consultation checks

on:
  push:
    branches: [feat/acp-product-consultation, feat/acp-ready-access, feat/acp-offer-posters, fix/acp-campaign-promotions-search, feat/acp-live-refresh, fix/acp-results-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Compile and run isolated ACP tests
        run: bash gradlew testDebugUnitTest --tests 'com.example.data.acp.*' -x processDebugGoogleServices
