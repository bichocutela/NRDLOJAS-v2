name: Corrigir atualização ao vivo das fotos

on:
  push:
    branches: ["fix-live-product-photo-refresh"]
    paths:
      - ".github/workflows/fix-live-product-photo-refresh.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção
        run: python3 .github/data-jobs/fix-live-product-photo-refresh.py

      - name: Conferir alteração
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/FirebaseService.kt app/src/main/java/com/example/ui/SearchScreen.kt
          git commit -m "Atualiza fotos dos produtos sem reiniciar sessão"
          git push
