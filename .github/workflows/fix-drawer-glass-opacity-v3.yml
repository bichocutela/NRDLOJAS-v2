name: Corrigir Opacidade Drawer Glass V3

on:
  push:
    paths:
      - '.github/workflows/fix-drawer-glass-opacity-v3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 tools/fix_drawer_glass_opacity_v3.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "Reforça lâmina interna do drawer Glass"
          git push
