name: Apply About auto install update
on:
  push:
    paths:
      - '.github/workflows/apply-about-auto-install.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Auto-open installer after APK download
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/AboutScreen.kt')
          s = p.read_text()
          needle = '                                updateDownloadHandle = null\n                                break\n'
          replacement = '                                updateDownloadHandle = null\n                                com.example.util.UpdateChecker.installDownloadedApk(context, state.filePath)\n                                break\n'
          success_marker = 'android.app.DownloadManager.STATUS_SUCCESSFUL -> {'
          start = s.find(success_marker)
          if start < 0:
              raise SystemExit('success status block not found')
          pos = s.find(needle, start)
          if pos < 0:
              raise SystemExit('download completion lines not found')
          s = s[:pos] + s[pos:].replace(needle, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AboutScreen.kt
          git commit -m "fix: open Android installer when update download finishes"
          git push
