name: Atalho Mestre no banner da Home

on:
  push:
    branches: ["feat/master-banner-double-tap"]
    paths:
      - ".github/workflows/master-banner-double-tap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alterações
        run: python3 .github/data-jobs/master-banner-double-tap.py

      - name: Validar diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Publicar alteração na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/SearchScreen.kt app/src/main/java/com/example/ui/BannerPreviewEditor.kt app/src/main/java/com/example/ui/MestreScreen.kt app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "Adiciona edição rápida do banner para Mestre"
          git push
