name: Flyer import checks

on:
  push:
    branches: [feat/importar-encartes, feat/native-pdf-flyer-parser]
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/example/data/flyer/**'
      - 'app/src/test/java/com/example/data/flyer/**'
      - '.github/workflows/flyer-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Compile and run flyer tests
        run: bash gradlew testDebugUnitTest --tests 'com.example.data.flyer.*' -x processDebugGoogleServices
