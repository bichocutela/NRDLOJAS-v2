name: Adicionar link de imagem no painel administrativo

on:
  push:
    branches: ["add-admin-paste-image-link"]
    paths:
      - ".github/workflows/add-admin-paste-image-link.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alteração
        run: python3 .github/data-jobs/add-admin-paste-image-link.py

      - name: Conferir diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AdminScreen.kt
          git commit -m "Adiciona colar link de foto no painel administrativo"
          git push
