name: Corrigir import prévia Glass

on:
  push:
    paths:
      - '.github/workflows/fix_glass_settings_clip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir import clip
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/SettingsScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.draw.clip\n' not in s:
              s = s.replace('import androidx.compose.ui.Alignment\n', 'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.draw.clip\n', 1)
          p.write_text(s)
      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/SettingsScreen.kt
          git commit -m "Corrige prévia visual do Glass nas configurações"
          git push
