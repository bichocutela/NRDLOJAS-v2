name: Ajustar compilação do gesto duplo

on:
  push:
    branches: ["feat/master-banner-double-tap"]
    paths:
      - ".github/workflows/master-banner-double-tap-optin.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar opt-in
        run: python3 .github/data-jobs/master-banner-double-tap-optin.py
      - name: Validar diff
        run: |
          git diff --check
          git diff --stat
      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/SearchScreen.kt
          git commit -m "Corrige compilação do gesto duplo no banner"
          git push
