name: Apply drawer version status

on:
  push:
    paths:
      - '.github/workflows/apply-drawer-version-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drawer
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()
          old = "    var expandedCategory by remember { mutableStateOf<String?>(null) }\n    val scope = rememberCoroutineScope()\n"
          new = old + "    var drawerUpdateAvailable by remember { mutableStateOf(false) }\n\n    LaunchedEffect(Unit) {\n        drawerUpdateAvailable = when (val result = com.example.util.UpdateChecker.checkLatestRelease()) {\n            is com.example.util.ReleaseCheckResult.Success ->\n                com.example.util.UpdateChecker.isRemoteVersionNewer(\n                    com.example.BuildConfig.VERSION_NAME,\n                    result.tagName\n                )\n            else -> false\n        }\n    }\n"
          if old not in s:
              raise SystemExit('state point not found')
          s = s.replace(old, new, 1)
          marker = '        Button(onClick = onGoToAbout, modifier = Modifier.fillMaxWidth().height(46.dp)) { Text("Sobre") }\n'
          version_expr = '$' + '{com.example.BuildConfig.VERSION_NAME}'
          addition = marker + '        Spacer(modifier = Modifier.height(10.dp))\n        Text(\n            text = "Versão instalada: v' + version_expr + '",\n            style = MaterialTheme.typography.bodySmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n            modifier = Modifier.align(Alignment.CenterHorizontally)\n        )\n        if (drawerUpdateAvailable) {\n            Spacer(modifier = Modifier.height(6.dp))\n            Button(\n                onClick = onGoToAbout,\n                modifier = Modifier.fillMaxWidth().height(42.dp)\n            ) {\n                Text("Existe Atualização", style = MaterialTheme.typography.labelLarge)\n            }\n        }\n'
          if marker not in s:
              raise SystemExit('about point not found')
          s = s.replace(marker, addition, 1)
          p.write_text(s)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "feat: show app version and update shortcut in drawer"
          git push