name: Apply drawer version status

on:
  push:
    paths:
      - '.github/workflows/apply-drawer-version-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Add installed version and update shortcut
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()

          state_old = """    var expandedCategory by remember { mutableStateOf<String?>(null) }
    val scope = rememberCoroutineScope()

    Column("""
          state_new = """    var expandedCategory by remember { mutableStateOf<String?>(null) }
    val scope = rememberCoroutineScope()
    var drawerUpdateAvailable by remember { mutableStateOf(false) }

    LaunchedEffect(Unit) {
        drawerUpdateAvailable = when (val result = com.example.util.UpdateChecker.checkLatestRelease()) {
            is com.example.util.ReleaseCheckResult.Success ->
                com.example.util.UpdateChecker.isRemoteVersionNewer(
                    com.example.BuildConfig.VERSION_NAME,
                    result.tagName
                )
            else -> false
        }
    }

    Column("""
          if state_old not in s:
              raise SystemExit('drawer state insertion point not found')
          s = s.replace(state_old, state_new, 1)

          about_old = """        Button(onClick = onGoToAbout, modifier = Modifier.fillMaxWidth().height(46.dp)) { Text(\"Sobre\") }
    }
}"""
          about_new = """        Button(onClick = onGoToAbout, modifier = Modifier.fillMaxWidth().height(46.dp)) { Text(\"Sobre\") }
        Spacer(modifier = Modifier.height(10.dp))
        Text(
            text = \"Versão instalada: v${com.example.BuildConfig.VERSION_NAME}\",
            style = MaterialTheme.typography.bodySmall,
            color = MaterialTheme.colorScheme.onSurfaceVariant,
            modifier = Modifier.align(Alignment.CenterHorizontally)
        )
        if (drawerUpdateAvailable) {
            Spacer(modifier = Modifier.height(6.dp))
            Button(
                onClick = onGoToAbout,
                modifier = Modifier.fillMaxWidth().height(42.dp)
            ) {
                Text(\"Existe Atualização\", style = MaterialTheme.typography.labelLarge)
            }
        }
    }
}"""
          if about_old not in s:
              raise SystemExit('About button insertion point not found')
          s = s.replace(about_old, about_new, 1)
          p.write_text(s)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "feat: show app version and update shortcut in drawer"
          git push