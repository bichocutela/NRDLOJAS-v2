name: Apply remember password patch

on:
  push:
    branches:
      - feat/remember-nossa-gente-password
    paths:
      - .github/workflows/temp-remember-nossa-gente-password.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remember-nossa-gente-password
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_remember_nossa_gente_password.py
      - name: Commit patch
        run: |
          git config user.name "NRD automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/PromotionsScreen.kt
          git diff --cached --check
          git commit -m "feat: permitir salvar acesso do Nossa Gente localmente"
          git push origin HEAD:feat/remember-nossa-gente-password
