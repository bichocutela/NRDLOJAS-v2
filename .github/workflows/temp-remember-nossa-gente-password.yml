name: Temporary remember Nossa Gente password patch

on:
  push:
    branches:
      - feat/remember-nossa-gente-password
    paths:
      - .github/workflows/temp-remember-nossa-gente-password.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/remember-nossa-gente-password
          fetch-depth: 0

      - name: Apply secure local credential storage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          screen_path = Path("app/src/main/java/com/example/ui/PromotionsScreen.kt")
          text = screen_path.read_text(encoding="utf-8")

          old = "import com.example.data.NossaGenteApi\n"
          new = "import com.example.data.NossaGenteApi\nimport com.example.data.NossaGenteCredentialStore\n"
          assert old in text and "NossaGenteCredentialStore" not in text
          text = text.replace(old, new, 1)

          old = '''    var cpf by remember { mutableStateOf("") }
    var password by remember { mutableStateOf("") }
    var error by remember { mutableStateOf<String?>(null) }
    var isLoading by remember { mutableStateOf(false) }
    val scope = rememberCoroutineScope()

    LaunchedEffect(api) {
        if (api.hasSession()) {
            onLoginSuccess()
        }
    }
'''
          new = '''    var cpf by remember { mutableStateOf("") }
    var password by remember { mutableStateOf("") }
    var saveCredentials by remember { mutableStateOf(false) }
    var error by remember { mutableStateOf<String?>(null) }
    var isLoading by remember { mutableStateOf(false) }
    val scope = rememberCoroutineScope()
    val context = LocalContext.current
    val credentialStore = remember(context) { NossaGenteCredentialStore(context.applicationContext) }

    LaunchedEffect(credentialStore) {
        val saved = withContext(Dispatchers.IO) { credentialStore.load() }
        if (saved != null) {
            cpf = saved.cpf
            password = saved.password
            saveCredentials = true
        }
    }

    LaunchedEffect(api) {
        if (api.hasSession()) {
            onLoginSuccess()
        }
    }
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            Text(
                "Use seu CPF e sua senha do Nossa Gente. A senha é usada somente nesta autenticação e não é salva no aparelho.",
                style = MaterialTheme.typography.bodyMedium
            )
'''
          new = '''            Text(
                "Use seu CPF e sua senha do Nossa Gente. Se quiser, você pode salvar o acesso neste aparelho para não precisar digitar toda vez.",
                style = MaterialTheme.typography.bodyMedium
            )
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            OutlinedTextField(
                value = password,
                onValueChange = { password = it },
                label = { Text("Senha") },
                singleLine = true,
                visualTransformation = PasswordVisualTransformation(),
                modifier = Modifier.fillMaxWidth()
            )
            Spacer(Modifier.height(12.dp))
'''
          new = '''            OutlinedTextField(
                value = password,
                onValueChange = { password = it },
                label = { Text("Senha") },
                singleLine = true,
                visualTransformation = PasswordVisualTransformation(),
                modifier = Modifier.fillMaxWidth()
            )
            Spacer(Modifier.height(8.dp))
            Row(
                modifier = Modifier.fillMaxWidth(),
                verticalAlignment = Alignment.CenterVertically
            ) {
                androidx.compose.material3.Checkbox(
                    checked = saveCredentials,
                    onCheckedChange = { checked ->
                        saveCredentials = checked
                        if (!checked) {
                            scope.launch(Dispatchers.IO) { credentialStore.clear() }
                        }
                    }
                )
                Text(
                    text = "Salvar CPF e senha neste aparelho",
                    style = MaterialTheme.typography.bodyMedium
                )
            }
            Text(
                text = "O acesso salvo fica criptografado localmente neste aparelho.",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
                modifier = Modifier.fillMaxWidth()
            )
            Spacer(Modifier.height(12.dp))
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                            NossaGenteLoginResult.Success -> {
                                password = ""
                                if (api.hasSession()) {
                                    onLoginSuccess()
                                } else {
                                    error = "A sessão não ficou disponível. Tente novamente."
                                }
                            }
'''
          new = '''                            NossaGenteLoginResult.Success -> {
                                if (api.hasSession()) {
                                    if (saveCredentials) {
                                        withContext(Dispatchers.IO) {
                                            credentialStore.save(cpf = cpf, password = password)
                                        }
                                    } else {
                                        withContext(Dispatchers.IO) { credentialStore.clear() }
                                        password = ""
                                    }
                                    onLoginSuccess()
                                } else {
                                    error = "A sessão não ficou disponível. Tente novamente."
                                }
                            }
'''
          assert old in text
          text = text.replace(old, new, 1)
          screen_path.write_text(text, encoding="utf-8")

          store_path = Path("app/src/main/java/com/example/data/NossaGenteCredentialStore.kt")
          store_path.write_text(r'''package com.example.data

import android.content.Context
import android.security.keystore.KeyGenParameterSpec
import android.security.keystore.KeyProperties
import android.util.Base64
import java.nio.charset.StandardCharsets
import java.security.KeyStore
import javax.crypto.Cipher
import javax.crypto.KeyGenerator
import javax.crypto.SecretKey
import javax.crypto.spec.GCMParameterSpec

data class NossaGenteSavedCredentials(
    val cpf: String,
    val password: String
)

class NossaGenteCredentialStore(context: Context) {
    private val preferences = context.getSharedPreferences(PREFERENCES_NAME, Context.MODE_PRIVATE)

    fun load(): NossaGenteSavedCredentials? {
        val encoded = preferences.getString(KEY_CREDENTIALS, null) ?: return null
        return runCatching {
            val packed = Base64.decode(encoded, Base64.NO_WRAP)
            require(packed.size > IV_LENGTH_BYTES)
            val iv = packed.copyOfRange(0, IV_LENGTH_BYTES)
            val encrypted = packed.copyOfRange(IV_LENGTH_BYTES, packed.size)
            val cipher = Cipher.getInstance(TRANSFORMATION)
            cipher.init(Cipher.DECRYPT_MODE, getOrCreateKey(), GCMParameterSpec(GCM_TAG_LENGTH_BITS, iv))
            val plainText = cipher.doFinal(encrypted).toString(StandardCharsets.UTF_8)
            val separator = plainText.indexOf(SEPARATOR)
            require(separator > 0)
            val cpf = plainText.substring(0, separator).filter(Char::isDigit).take(11)
            val password = plainText.substring(separator + 1)
            require(cpf.length == 11 && password.isNotEmpty())
            NossaGenteSavedCredentials(cpf = cpf, password = password)
        }.getOrElse {
            clear()
            null
        }
    }

    fun save(cpf: String, password: String) {
        val normalizedCpf = cpf.filter(Char::isDigit).take(11)
        require(normalizedCpf.length == 11)
        require(password.isNotEmpty())

        val cipher = Cipher.getInstance(TRANSFORMATION)
        cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey())
        val plainText = "$normalizedCpf$SEPARATOR$password".toByteArray(StandardCharsets.UTF_8)
        val encrypted = cipher.doFinal(plainText)
        val packed = cipher.iv + encrypted
        val encoded = Base64.encodeToString(packed, Base64.NO_WRAP)
        preferences.edit().putString(KEY_CREDENTIALS, encoded).apply()
    }

    fun clear() {
        preferences.edit().remove(KEY_CREDENTIALS).apply()
    }

    private fun getOrCreateKey(): SecretKey {
        val keyStore = KeyStore.getInstance(KEYSTORE_PROVIDER).apply { load(null) }
        (keyStore.getKey(KEY_ALIAS, null) as? SecretKey)?.let { return it }

        val keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, KEYSTORE_PROVIDER)
        val spec = KeyGenParameterSpec.Builder(
            KEY_ALIAS,
            KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
        )
            .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
            .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
            .setRandomizedEncryptionRequired(true)
            .build()
        keyGenerator.init(spec)
        return keyGenerator.generateKey()
    }

    private companion object {
        const val PREFERENCES_NAME = "nossa_gente_secure_credentials"
        const val KEY_CREDENTIALS = "credentials_v1"
        const val KEY_ALIAS = "nrd_nossa_gente_credentials_v1"
        const val KEYSTORE_PROVIDER = "AndroidKeyStore"
        const val TRANSFORMATION = "AES/GCM/NoPadding"
        const val GCM_TAG_LENGTH_BITS = 128
        const val IV_LENGTH_BYTES = 12
        const val SEPARATOR = '\u0000'
    }
}
''', encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "NRD automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/PromotionsScreen.kt app/src/main/java/com/example/data/NossaGenteCredentialStore.kt
          git diff --cached --check
          git commit -m "feat: salvar acesso do Nossa Gente localmente"
          git push origin HEAD:feat/remember-nossa-gente-password
