                "driveId": "1AjnKE7qkxLStr9WIByfyqQyeh3RmDuZ0",
                "sha256": "1facefdbea2f0198343d940db8ba64e0bb174515745b85f0aaebe3e7759ff7cc"
              },
              {
                "theme": "red",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-1fbab9f6-7319-48fb-a5dc-1a678e064565.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-red.png",
                "driveId": "1mjJgcw7Gi7PQGnu6S9q4m9wmJFyyNjkl",
                "sha256": "ae07935e07a1c150b13e1df02a6e0fa00a789920a99cef0092e516cc9b128a9e"
              },
              {
                "theme": "gold",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-2ac473df-91f0-455a-8fe8-7a538f5db74f.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-gold.png",
                "driveId": "1nftqh9GCLQtDIs1YxDZhFkZgOzb4Es3b",
                "sha256": "720018a5311069b4f711de52806de874b36e7fa1fabd9ad556d7479173ce15b8"
              },
              {
                "theme": "green",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-77cb2001-8365-44ad-b9b7-d01a9ba51ea4.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-green.png",
                "driveId": "1mhg9Yzibfg_fuoXArJCSlrXHEp2Z8Kas",
                "sha256": "46971fc1e8a717b21123f482a250aa9faa254efb51386955fbfedb81d7c32fd5"
              },
              {
                "theme": "blue",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-522ecee6-7699-4a54-a030-9c4dbf616d5f.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-blue.png",
                "driveId": "1_8x1BV9j-cRuXCP_PnCrlMtrhWZuBYrm",
                "sha256": "1bb63e8880c125ff997ebea428dd23ce691c35c58111f8c89e41f8c677392e3c"
              },
              {
                "theme": "orange",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-76a5c8bf-4909-4d82-8a8c-10b83836eb30.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-orange.png",
                "driveId": "1Oojusm3Q-ZC4B-BQ5pr0zhXnnVVKH6GY",
                "sha256": "348a88f46d8c49a372738f7670fdd09c716bdc00d373206ee5ef4f23a2e0a11f"
              },
              {
                "theme": "glass",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-f141c04f-4656-4435-ac8a-730eb570e7b2.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-glass.png",
                "driveId": "1sYQkrelWSZ43noS1MIMgz0LeKRBIXjVs",
                "sha256": "fc5282014a9aef3c6e311c6d14b64a6e8720c4410c2e23f19ed06248ab6d1556"
              },
              {
                "theme": "expressive",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-d757c749-ba86-4a05-b5d5-c22de4d0262c.png",
                "final": "/workspace/scratch/4364807ed99b/nrd-recovery/aug2027/sexta13-expressive.png",
                "driveId": "19Y5fAgNR7u3SDjAuea-3FDn2KUi3u7UL",
                "sha256": "ad5dbb4769b56f3165b0b611950ddf59c0cb7b4671adb614a2a38a01d3e86047"
              }
            ]
          }
          NRD_PLAN
      - name: Verify 8 public Friday-13 horror images and prepare dated schedules
        run: node publish.mjs prepare
      - name: Store appearance backup before publication
        uses: actions/upload-artifact@v4
        with:
          name: appearance-before-friday13
          path: appearance-backup-before.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish Friday 13 November only, with concurrency guard and exact readback
        run: node publish.mjs apply
      - name: Store verified publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-friday13-result
          path: appearance-readback-after.json
          retention-days: 30
          if-no-files-found: ignore
