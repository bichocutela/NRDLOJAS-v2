name: Publish Show de Selos original artwork 12-22 November
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nrd-appearance-drive-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nrd-appearance-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare original-artwork publication
        shell: bash
        run: |
          cat > publish.mjs <<'NRD_SCRIPT'
          import {createSign,createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const plan=JSON.parse(readFileSync('publication-plan.json','utf8'));
          const endpoint='https://firestore.googleapis.com/v1/projects/appcodigo-7f245/databases/(default)/documents/config/appSettings';
          const START='2026-11-12',END='2026-11-22';
          const str=x=>({stringValue:x}),get=(row,k)=>row.mapValue.fields[k]?.stringValue;
          const active=(row,d)=>row.mapValue.fields.isActive?.booleanValue&&get(row,'startDate')<=d&&(!get(row,'endDate')||get(row,'endDate')>=d);
          const winner=(rows,d)=>rows.filter(r=>active(r,d)).sort((a,b)=>get(b,'startDate').localeCompare(get(a,'startDate')))[0];
          function transform(before){
           const fields=structuredClone(before.fields),map=fields.appearanceThemeBackgrounds.mapValue.fields;
           assert.equal(plan.entries.length,8);assert.equal(new Set(plan.entries.map(e=>e.theme)).size,8);
           for(const e of plan.entries){
            const old=map[e.theme]?.arrayValue.values||[],rows=[];
            for(const row of old){
             const f=row.mapValue.fields,s=get(row,'startDate'),end=get(row,'endDate');
             if(get(row,'id')===e.id) continue;
             if(!f.isActive?.booleanValue||!s||s>END||(end&&end<START)){rows.push(row);continue;}
             if(s<START){const a=structuredClone(row);a.mapValue.fields.endDate=str('2026-11-11');rows.push(a);}
             if(!end||end>END){const a=structuredClone(row);a.mapValue.fields.startDate=str('2026-11-23');a.mapValue.fields.id=str(get(row,'id')+'-after-show-selos-20261122');rows.push(a);}
            }
            rows.push({mapValue:{fields:{id:str(e.id),label:str('Show de Selos — '+e.label+' — 12 a 22/11/2026'),url:str('https://drive.google.com/uc?export=download&id='+e.driveId),isActive:{booleanValue:true},startDate:str(START),endDate:str(END),imageScale:{doubleValue:1},imageOffsetX:{doubleValue:0},imageOffsetY:{doubleValue:0},imageStretchX:{doubleValue:1},imageStretchY:{doubleValue:1}}}});
            for(let day=12;day<=22;day++)assert.equal(get(winner(rows,'2026-11-'+day),'id'),e.id);
            for(const day of ['2026-11-11','2026-11-23'])assert.equal(get(winner(rows,day)||{mapValue:{fields:{}}},'url'),get(winner(old,day)||{mapValue:{fields:{}}},'url'),'Adjacent campaign changed');
            map[e.theme]={arrayValue:{values:rows}};
           }
           fields.appearanceRevision={integerValue:String(Math.max(Date.now(),Number(before.fields.appearanceRevision?.integerValue||0)+1))};
           const restored=structuredClone(fields);restored.appearanceThemeBackgrounds=before.fields.appearanceThemeBackgrounds;restored.appearanceRevision=before.fields.appearanceRevision;assert.deepEqual(restored,before.fields);
           return fields;
          }
          async function token(){const a=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');assert.equal(a.project_id,'appcodigo-7f245');const now=Math.floor(Date.now()/1000),enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');const b=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:a.client_email,sub:a.client_email,aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+600,scope:'https://www.googleapis.com/auth/datastore'});const s=createSign('RSA-SHA256');s.update(b);s.end();const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:b+'.'+s.sign(a.private_key).toString('base64url')}),signal:AbortSignal.timeout(30000)});assert(r.ok,'OAuth HTTP '+r.status);return(await r.json()).access_token;}
          async function current(t){const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(30000)});assert(r.ok,'Read HTTP '+r.status);return r.json();}
          if(process.argv[2]==='dry'){
           const x=JSON.parse(readFileSync(process.argv[3],'utf8'));transform(x);console.log('8 themes and all 88 campaign-day selections validated; adjacent schedules preserved');
          }else if(process.argv[2]==='prepare'){
           const t=await token(),before=await current(t);
           for(const e of plan.entries){const r=await fetch('https://drive.google.com/uc?export=download&id='+e.driveId,{signal:AbortSignal.timeout(60000)});assert(r.ok,'Drive HTTP '+r.status);const b=Buffer.from(await r.arrayBuffer());assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');assert.equal(createHash('sha256').update(b).digest('hex'),e.sha256,'Image integrity '+e.theme);}
           const fields=transform(before);writeFileSync('.before-full.json',JSON.stringify(before));writeFileSync('appearance-backup-before.json',JSON.stringify({updateTime:before.updateTime,fields:Object.fromEntries(Object.entries(before.fields).filter(([k])=>k.startsWith('appearance')))}));writeFileSync('.prepared.json',JSON.stringify({fields:{appearanceThemeBackgrounds:fields.appearanceThemeBackgrounds,appearanceRevision:fields.appearanceRevision},updateTime:before.updateTime}));console.log('8 public original-logo artwork files verified and dated schedules prepared');
          }else if(process.argv[2]==='apply'){
           const t=await token(),before=JSON.parse(readFileSync('.before-full.json','utf8')),p=JSON.parse(readFileSync('.prepared.json','utf8'));const url=new URL(endpoint);for(const k of Object.keys(p.fields))url.searchParams.append('updateMask.fieldPaths',k);url.searchParams.set('currentDocument.updateTime',p.updateTime);
           const r=await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:p.fields}),signal:AbortSignal.timeout(60000)});assert(r.ok,'Publish HTTP '+r.status);const after=await current(t);const expected=structuredClone(before.fields);Object.assign(expected,p.fields);assert.deepEqual(after.fields,expected);writeFileSync('appearance-readback-after.json',JSON.stringify({updateTime:after.updateTime,fields:Object.fromEntries(Object.entries(after.fields).filter(([k])=>k.startsWith('appearance')))}));console.log('Published 8 themes from 2026-11-12 through 2026-11-22 inclusive; exact readback verified');
          }else throw Error('Expected dry/prepare/apply');
          NRD_SCRIPT
          cat > publication-plan.json <<'NRD_PLAN'
          {
            "project": "appcodigo-7f245",
            "entries": [
              {
                "theme": "multicolor",
                "driveId": "1zP3Uzmu1fzLz325lc_QNG77u0tEmjZKa",
                "id": "nrd-show-selos-20261112-multicolor",
                "label": "Multicolorido",
                "sha256": "2550ab48cf3a441c7ef5dce29f585f4d43605b318bab78b29b78b0e0eeea06d7"
              },
              {
                "theme": "red",
                "driveId": "1gLC930zkyThCoN1SAClqU0wZMdEmoEpU",
                "id": "nrd-show-selos-20261112-red",
                "label": "Vermelho",
                "sha256": "77f79aab0dda846db5ebf1005a48576a2875dc9d7b0c5e6a50756fc9c0b09389"
              },
              {
                "theme": "green",
                "driveId": "1B20nOo5EgM-IT-WFesyfQi6VVXxfUw0f",
                "id": "nrd-show-selos-20261112-green",
                "label": "Verde",
                "sha256": "bc95645aadcbeb23e82c557fe640fdb011cdeed5d6116a32411d926b87a95ff2"
              },
              {
                "theme": "orange",
                "driveId": "1KijFgiN7Tdi42UtKS5ZWZBcUYr0idL86",
                "id": "nrd-show-selos-20261112-orange",
                "label": "Laranja",
                "sha256": "a4329779cf1d5b7805201070da67e6a800a134db0f52e72fdbebfd039ce34ace"
              },
              {
                "theme": "blue",
                "driveId": "1i6fS_-RgjsjmC324ZboJH42evrTW3c4o",
                "id": "nrd-show-selos-20261112-blue",
                "label": "Azul",
                "sha256": "d36d3f9e91b8139501237a961190970873e369fdbb841521c7c11ca4640f3252"
              },
              {
                "theme": "gold",
                "driveId": "1BzN1Sr2v5lQu1MCmxZ1vYHxL_cmdtH6L",
                "id": "nrd-show-selos-20261112-gold",
                "label": "Dourado",
                "sha256": "4ffb4ff888f1b5988a427c6acadcb93bf74b44be967313e0e200884675fc0400"
              },
              {
                "theme": "expressive",
                "driveId": "1RPlX2slFbXBJ9_eOlrSnPzCL8sxM5nlY",
                "id": "nrd-show-selos-20261112-expressive",
                "label": "Glass Expressivo",
                "sha256": "c4bbcb4ed0170177aa2703ac1aef5ab3f06bec9889a8bb6fe2bdfcb6d8b3c286"
              },
              {
                "theme": "glass",
                "driveId": "1fXkI-5fT9dlFQgLxhBxh9f0wa5zm2MF3",
                "id": "nrd-show-selos-20261112-glass",
                "label": "Glass Soft",
                "sha256": "041a92712994473d95dddbfe682a16a36d4c4ffd1964b4ac6638a7b61d9f8349"
              }
            ]
          }
          NRD_PLAN
      - name: Verify eight public files and prepare dated schedules
        run: node publish.mjs prepare
      - name: Store appearance backup before publication
        uses: actions/upload-artifact@v4
        with:
          name: appearance-before-show-selos
          path: appearance-backup-before.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish 12 through 22 November with concurrency guard and exact readback
        run: node publish.mjs apply
      - name: Store verified publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-show-selos-result
          path: appearance-readback-after.json
          retention-days: 30
          if-no-files-found: ignore
