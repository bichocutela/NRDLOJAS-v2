name: Publish Hortifruti November 11-12 themes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nrd-appearance-drive-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nrd-appearance-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare original-artwork publication
        shell: bash
        run: |
          cat > publish.mjs <<'NRD_SCRIPT'
          import {createSign,createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const plan=JSON.parse(readFileSync('publication-plan.json','utf8'));
          const endpoint='https://firestore.googleapis.com/v1/projects/appcodigo-7f245/databases/(default)/documents/config/appSettings';
          const prefix='https://kkayksyzksexoarpfxyj.supabase.co/storage/v1/object/public/nrdlojas-images/';
          const drive=id=>'https://drive.google.com/uc?export=download&id='+id;
          async function token(){
           const a=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
           assert.equal(a.project_id,plan.project,'Unexpected Firebase project');
           const now=Math.floor(Date.now()/1000),enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
           const body=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:a.client_email,sub:a.client_email,aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+600,scope:'https://www.googleapis.com/auth/datastore'});
           const signer=createSign('RSA-SHA256');signer.update(body);signer.end();
           const assertion=body+'.'+signer.sign(a.private_key).toString('base64url');
           const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion}),signal:AbortSignal.timeout(30000)});
           assert(r.ok,'Firebase OAuth failed HTTP '+r.status);return (await r.json()).access_token;
          }
          async function current(t){const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(30000)});assert(r.ok,'Firestore read failed HTTP '+r.status);return r.json();}
          const sv=stringValue=>({stringValue}),num=doubleValue=>({doubleValue});
          const writable=['appearanceThemeBackgrounds','appearanceCardBackgrounds','appearanceConsultationBackgrounds','appearanceRevision'];
          function unchanged(fields){return Object.fromEntries(Object.entries(fields).filter(([k])=>!writable.includes(k)));}
          function transform(before){
           const fields=structuredClone(before.fields);let changed=0;
           const counts=new Map(plan.replacements.map(x=>[x.original,0]));
           function walk(value){
            if(Array.isArray(value)){value.forEach(walk);return;}
            if(!value||typeof value!=='object')return;
            if(typeof value.stringValue==='string'){
             const x=plan.replacements.find(x=>value.stringValue===prefix+x.original);
             if(x){value.stringValue=drive(x.driveId);counts.set(x.original,counts.get(x.original)+1);changed++;}
            } else Object.values(value).forEach(walk);
           }
           for(const key of writable.filter(k=>k!=='appearanceRevision'))walk(fields[key]);
           for(const x of plan.replacements){
            const present=JSON.stringify(fields).includes(drive(x.driveId));assert(present,'Missing source/reference '+x.original);
           }
           const themes=fields.appearanceThemeBackgrounds.mapValue.fields;
           for(const c of plan.campaigns){
            assert(themes[c.theme],'Unknown theme '+c.theme);
            const values=themes[c.theme].arrayValue.values??=[];
            const id='nrd-hortifruti-20261111-'+c.theme;
            for(const row of values){const f=row.mapValue.fields;const oldId=f.id?.stringValue;if(oldId==='nrd-11-11-ofertas-2026-'+c.theme||oldId==='nrd-show-selos-20261112-'+c.theme) f.isActive={booleanValue:false};}
          
            const index=values.findIndex(x=>x.mapValue.fields.id?.stringValue===id);
            const conflict=values.find(x=>x.mapValue.fields.startDate?.stringValue===plan.date&&x.mapValue.fields.isActive?.booleanValue===true&&x.mapValue.fields.id?.stringValue!==id);
            assert(!conflict,'Existing same-day schedule requires review: '+c.theme);
            const base=index<0?{}:values[index].mapValue.fields;
            const entry={mapValue:{fields:{imageScale:num(1),imageOffsetX:num(0),imageOffsetY:num(0),imageStretchX:num(1),imageStretchY:num(1),...base,id:sv(id),label:sv('Quarta e Quinta Hortifruti — 11 a 12/11/2026'),url:sv(drive(c.driveId)),isActive:{booleanValue:true},startDate:sv(plan.date),endDate:sv(plan.endDate)}}};
            if(index<0)values.push(entry);else values[index]=entry;
           }
           fields.appearanceRevision={integerValue:String(Math.max(Date.now(),Number(before.fields.appearanceRevision?.integerValue||0)+1))};
           assert.deepEqual(unchanged(fields),unchanged(before.fields));
           return {fields,changed};
          }
          if(process.argv[2]==='dry'){
           const before=JSON.parse(readFileSync(process.argv[3],'utf8'));const out=transform(before);
           console.log('Validated transformation:',out.changed,'URL replacements and',plan.campaigns.length,'campaigns; other fields preserved');
          }else if(process.argv[2]==='prepare'){
           const t=await token();const before=await current(t);
           for(const x of [...plan.replacements,...plan.campaigns]){
            const r=await fetch(drive(x.driveId),{signal:AbortSignal.timeout(60000)});
            assert(r.ok,'Drive public download failed '+x.driveId+' HTTP '+r.status);
            const bytes=Buffer.from(await r.arrayBuffer());assert.equal(createHash('sha256').update(bytes).digest('hex'),x.sha256,'Drive checksum mismatch '+x.driveId);
           }
           const out=transform(before);
           writeFileSync('.before-full.json',JSON.stringify(before));
           writeFileSync('appearance-backup-before.json',JSON.stringify({name:before.name,updateTime:before.updateTime,fields:Object.fromEntries(Object.entries(before.fields).filter(([k])=>k.startsWith('appearance')))},null,2));
           writeFileSync('.prepared.json',JSON.stringify({fields:Object.fromEntries(writable.map(k=>[k,out.fields[k]])),updateTime:before.updateTime}));
           writeFileSync('migration-summary.json',JSON.stringify({replacements:out.changed,campaigns:plan.campaigns.length,date:plan.date,driveIntegrity:'24 SHA-256 matches'},null,2));
           console.log('Prepared:',out.changed,'URL replacements;',plan.campaigns.length,'campaigns; all public Drive hashes verified');
          }else if(process.argv[2]==='apply'){
           const t=await token(),before=JSON.parse(readFileSync('.before-full.json','utf8')),prepared=JSON.parse(readFileSync('.prepared.json','utf8'));
           const url=new URL(endpoint);for(const key of writable)url.searchParams.append('updateMask.fieldPaths',key);url.searchParams.set('currentDocument.updateTime',prepared.updateTime);
           const r=await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:prepared.fields}),signal:AbortSignal.timeout(60000)});
           assert(r.ok,'Atomic Firestore update failed HTTP '+r.status);
           const after=await current(t);for(const key of writable)assert.deepEqual(after.fields[key],prepared.fields[key],'Readback mismatch '+key);
           assert.deepEqual(unchanged(after.fields),unchanged(before.fields),'Unrelated settings changed');
           for(const c of plan.campaigns){const rows=after.fields.appearanceThemeBackgrounds.mapValue.fields[c.theme].arrayValue.values;const matches=rows.filter(x=>x.mapValue.fields.id?.stringValue==='nrd-hortifruti-20261111-'+c.theme);assert.equal(matches.length,1);const f=matches[0].mapValue.fields;assert.equal(f.startDate.stringValue,plan.date);assert.equal(f.endDate.stringValue,plan.endDate);assert.equal(f.isActive.booleanValue,true);}
           writeFileSync('appearance-readback-after.json',JSON.stringify({updateTime:after.updateTime,fields:prepared.fields},null,2));
           console.log('Published and read back:',plan.replacements.length,'Drive references;',plan.campaigns.length,'active banners scheduled only for',plan.date);
          }else throw Error('Expected dry, prepare or apply');
          NRD_SCRIPT
          cat > publication-plan.json <<'NRD_PLAN'
          {
            "project": "appcodigo-7f245",
            "date": "2026-11-11",
            "endDate": "2026-11-12",
            "replacements": [],
            "campaigns": [
              {
                "theme": "multicolor",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-bd7216f5-00bf-433e-9363-54d2ce61aad8.png",
                "driveId": "12syn-X1eci8xWSLNROGWXHAMbjMmF_Gy",
                "sha256": "984f09c6b28c82330786502b0a2acd48cfa5cb706179efd6cd5d516cd628682a"
              },
              {
                "theme": "red",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-57a6c45a-eb10-4bcf-a6f3-d1c9a50e4d0c.png",
                "driveId": "1C1PM4_Uk4G93qfAhCM19OV_jzZ-i443A",
                "sha256": "073ddbb566d836d51af274362a55ecfbea682b905956abe6bc17ecb388822ba2"
              },
              {
                "theme": "gold",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-53c8c4a8-991c-466b-999f-094ad2f9eea1.png",
                "driveId": "1eWS5WHY0po1nEGXOv9W2crO_-9nzmGeS",
                "sha256": "29182fd800bd869c773b7bfe372db1a20b6cc50a8e6e10a065bab9dc4963426a"
              },
              {
                "theme": "green",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-9bb70921-6a87-4e81-94aa-7961d2b9ef90.png",
                "driveId": "1nA7r5qIorrakzX7lHZtyB1YZ4IjDhlFG",
                "sha256": "8576b0cff702d5d9e3504196dbc6d2270c203f73f3be36e3cb1826abaaccd761"
              },
              {
                "theme": "blue",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-3699ca06-562f-42f5-a1a7-32df3ee9eed6.png",
                "driveId": "14vEzkMbaVSfRQeOrZ4Dnw6LymvG9sW78",
                "sha256": "3d7d3e8df64d6feb4c5c4b0ab9bc92b62261fcd23393be28262f478955c73cdc"
              },
              {
                "theme": "orange",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-78ca66c3-7ae0-49f9-9eef-2c45179105b9.png",
                "driveId": "1DWYCsTEy18I8dJLUSMukfCM6tNYb727o",
                "sha256": "28a31e1b23d7bc6514d820a6b8d09f2fed2816d51765b979cb7b1d8ca7fa1b31"
              },
              {
                "theme": "glass",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-9357f256-634e-4860-b243-657a699f91a4.png",
                "driveId": "1m_VOYcHz-bPemPqZ6mla5NmKYnRADuBO",
                "sha256": "893506beb96c2b2096b27f785cd1b6ace4fe3f09ca33d4b09cba4e98d9f7b6e6"
              },
              {
                "theme": "expressive",
                "path": "/workspace/scratch/4364807ed99b/generated_images/exec-c02fa407-6387-491f-aa9c-0a729d591fcb.png",
                "driveId": "1YfXt58-02OeFhHM7RmIiCFr3JjN6OyW2",
                "sha256": "2073e2a5046d9e00227a1863593e4b9c1e89fb8134a2e1fbc502f26be47502e5"
              }
            ]
          }
          NRD_PLAN
      - name: Verify 8 public Friday-13 horror images and prepare dated schedules
        run: node publish.mjs prepare
      - name: Store appearance backup before publication
        uses: actions/upload-artifact@v4
        with:
          name: appearance-before-friday13
          path: appearance-backup-before.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish Friday 13 November only, with concurrency guard and exact readback
        run: node publish.mjs apply
      - name: Store verified publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-friday13-result
          path: appearance-readback-after.json
          retention-days: 30
          if-no-files-found: ignore
