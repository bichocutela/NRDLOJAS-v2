name: Publish richer 11-11 and 12-12 artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nrd-appearance-drive-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nrd-appearance-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare publication code and approved image map
        shell: bash
        run: |
          cat > publish.mjs <<'NRD_SCRIPT'
          import {createSign,createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const plan=JSON.parse(readFileSync('publication-plan.json','utf8'));
          const endpoint='https://firestore.googleapis.com/v1/projects/appcodigo-7f245/databases/(default)/documents/config/appSettings';
          const prefix='https://kkayksyzksexoarpfxyj.supabase.co/storage/v1/object/public/nrdlojas-images/';
          const drive=id=>'https://drive.google.com/uc?export=download&id='+id;
          async function token(){
           const a=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
           assert.equal(a.project_id,plan.project,'Unexpected Firebase project');
           const now=Math.floor(Date.now()/1000),enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
           const body=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:a.client_email,sub:a.client_email,aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+600,scope:'https://www.googleapis.com/auth/datastore'});
           const signer=createSign('RSA-SHA256');signer.update(body);signer.end();
           const assertion=body+'.'+signer.sign(a.private_key).toString('base64url');
           const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion}),signal:AbortSignal.timeout(30000)});
           assert(r.ok,'Firebase OAuth failed HTTP '+r.status);return (await r.json()).access_token;
          }
          async function current(t){const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(30000)});assert(r.ok,'Firestore read failed HTTP '+r.status);return r.json();}
          
          const writable=['appearanceThemeBackgrounds','appearanceRevision'];
          function transform(before){
           const fields=structuredClone(before.fields);
           assert.equal(plan.entries.length,16);assert.equal(new Set(plan.entries.map(e=>e.id)).size,16);
           for(const e of plan.entries){
            const rows=fields.appearanceThemeBackgrounds.mapValue.fields[e.theme].arrayValue.values;
            const matches=rows.filter(x=>x.mapValue.fields.id?.stringValue===e.id);assert.equal(matches.length,1,'Schedule missing or duplicated '+e.id);
            const f=matches[0].mapValue.fields;
            assert.equal(f.startDate.stringValue,e.date);assert.equal(f.endDate.stringValue,e.date);assert.equal(f.isActive.booleanValue,true);
            assert([e.expectedUrl,drive(e.driveId)].includes(f.url.stringValue),'Unexpected concurrent image change '+e.id);
            f.url={stringValue:drive(e.driveId)};
           }
           fields.appearanceRevision={integerValue:String(Math.max(Date.now(),Number(before.fields.appearanceRevision?.integerValue||0)+1))};
           // Exact deep equality after undoing only the approved URLs and revision.
           const restored=structuredClone(fields);
           for(const e of plan.entries){
            const old=before.fields.appearanceThemeBackgrounds.mapValue.fields[e.theme].arrayValue.values.find(x=>x.mapValue.fields.id?.stringValue===e.id);
            restored.appearanceThemeBackgrounds.mapValue.fields[e.theme].arrayValue.values.find(x=>x.mapValue.fields.id?.stringValue===e.id).mapValue.fields.url=structuredClone(old.mapValue.fields.url);
           }
           restored.appearanceRevision=structuredClone(before.fields.appearanceRevision);
           assert.deepEqual(restored,before.fields,'Only approved image URLs may change');
           return fields;
          }
          if(process.argv[2]==='dry'){
           transform(JSON.parse(readFileSync(process.argv[3],'utf8')));console.log('16 URL-only updates validated; all dates and framing preserved');
          }else if(process.argv[2]==='prepare'){
           const t=await token(),before=await current(t);
           for(const e of plan.entries){
            const r=await fetch(drive(e.driveId),{signal:AbortSignal.timeout(60000)});assert(r.ok,'Public download failed HTTP '+r.status);
            const b=Buffer.from(await r.arrayBuffer());assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
            assert.equal(createHash('sha256').update(b).digest('hex'),e.sha256,'Drive integrity failed '+e.id);
           }
           const fields=transform(before);
           writeFileSync('.before-full.json',JSON.stringify(before));
           writeFileSync('appearance-backup-before.json',JSON.stringify({updateTime:before.updateTime,fields:Object.fromEntries(Object.entries(before.fields).filter(([k])=>k.startsWith('appearance')))},null,2));
           writeFileSync('.prepared.json',JSON.stringify({fields:Object.fromEntries(writable.map(k=>[k,fields[k]])),updateTime:before.updateTime}));
           writeFileSync('migration-summary.json',JSON.stringify({images:16,sha256Verified:16,datesPreserved:true,framingPreserved:true},null,2));
           console.log('16 public PNG hashes verified; appearance backup ready');
          }else if(process.argv[2]==='apply'){
           const t=await token(),before=JSON.parse(readFileSync('.before-full.json','utf8')),p=JSON.parse(readFileSync('.prepared.json','utf8'));
           const url=new URL(endpoint);for(const k of writable)url.searchParams.append('updateMask.fieldPaths',k);url.searchParams.set('currentDocument.updateTime',p.updateTime);
           const r=await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:p.fields}),signal:AbortSignal.timeout(60000)});assert(r.ok,'Atomic publication failed HTTP '+r.status);
           const after=await current(t);const expected=structuredClone(before.fields);Object.assign(expected,p.fields);assert.deepEqual(after.fields,expected,'Full readback mismatch');
           writeFileSync('appearance-readback-after.json',JSON.stringify({updateTime:after.updateTime,fields:Object.fromEntries(Object.entries(after.fields).filter(([k])=>k.startsWith('appearance')))},null,2));
           console.log('Published 16 revised artworks, exact readback verified; dates, framing and other settings preserved');
          }else throw Error('Expected dry, prepare or apply');
          NRD_SCRIPT
