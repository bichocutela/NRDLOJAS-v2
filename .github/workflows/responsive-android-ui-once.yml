name: Revisar responsividade Android uma vez

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/responsive-android-ui-once.yml
      - .github/scripts/responsive_android_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aplicar revisão responsiva e scanner adaptativo
        run: python3 .github/scripts/responsive_android_ui.py
      - name: Corrigir wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
      - name: Validar compilação
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Remover temporários
        run: rm .github/workflows/responsive-android-ui-once.yml .github/scripts/responsive_android_ui.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ResponsiveLayout.kt app/src/main/java/com/example/ui/AcpProductsPanel.kt app/src/main/java/com/example/ui/ProductBarcodeDialog.kt app/src/main/java/com/example/ui/MestreDashboardOverview.kt app/src/main/java/com/example/ui/AcpBarcodeScanner.kt .github/workflows/responsive-android-ui-once.yml .github/scripts/responsive_android_ui.py
          git commit -m "Melhora responsividade em telas pequenas e adapta scanner"
          git push
