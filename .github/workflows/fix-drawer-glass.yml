name: Corrigir Glass Drawer

on:
  push:
    paths:
      - '.github/workflows/fix-drawer-glass.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 tools/fix_drawer_glass.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "Unifica Glass do drawer com o balão de código"
          git push
