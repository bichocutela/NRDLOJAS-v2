name: Apply live drawer update indicator fix
on:
  push:
    paths:
      - '.github/workflows/apply-live-update-indicator-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch drawer update state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()
          old = '''    val scope = rememberCoroutineScope()
    var drawerUpdateAvailable by remember { mutableStateOf(false) }

    LaunchedEffect(Unit) {
        drawerUpdateAvailable = when (val result = com.example.util.UpdateChecker.checkLatestRelease()) {
            is com.example.util.ReleaseCheckResult.Success ->
                com.example.util.UpdateChecker.isRemoteVersionNewer(
                    com.example.BuildConfig.VERSION_NAME,
                    result.tagName
                )
            else -> false
        }
    }
'''
          new = '''    val scope = rememberCoroutineScope()
    val context = LocalContext.current
    com.example.util.UpdateAvailabilityState.initialize(context)
    val drawerUpdateAvailable by com.example.util.UpdateAvailabilityState.available.collectAsState()

    LaunchedEffect(isLoggedIn, userRole) {
        com.example.util.UpdateAvailabilityState.clearIfCurrent(context)
        if (isLoggedIn && userRole == "mestre") {
            com.example.util.UpdateAvailabilityState.refresh(context)
        }
    }
'''
          if old not in s:
              raise SystemExit('drawer update block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "fix: make drawer update indicator follow 12h and master live rules"
          git push
