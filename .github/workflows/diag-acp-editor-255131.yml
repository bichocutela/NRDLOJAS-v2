name: Conferir Produtos ACP 255131

on:
  push:
    branches: ["diag/acp-255131-live"]
    paths:
      - ".github/workflows/diag-acp-editor-255131.yml"

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar navegador
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Pesquisar 255131 na tela Produtos
        env:
          ACP_LOGIN: ${{ secrets.ACP_LOGIN }}
          ACP_PASSWORD: ${{ secrets.ACP_PASSWORD }}
        run: |
          cat > products-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const origin='https://nordestao12.acp.app.br';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const api=context.request;
          const csrf=(await (await api.get(origin+'/api/auth/csrf')).json()).csrfToken;
          await api.post(origin+'/api/auth/callback/credentials',{headers:{Origin:origin,Referer:origin+'/login'},form:{login:process.env.ACP_LOGIN,password:process.env.ACP_PASSWORD,csrfToken:csrf,callbackUrl:origin+'/products',json:'true'}});
          const session=await (await api.get(origin+'/api/auth/session')).json();
          if(!session?.user?.accessToken) throw new Error('Sem sessão ACP');
          const page=await context.newPage();
          const reqs=[]; const hits=[];
          page.on('request',req=>{if(req.method()==='GET'&&/acp\.app\.br/i.test(req.url())) reqs.push(req.url());});
          page.on('response',async res=>{
            if(res.request().method()!=='GET'||!/acp\.app\.br/i.test(res.url())) return;
            const ct=(res.headers()['content-type']||'').toLowerCase(); if(!ct.includes('json')) return;
            try{const text=await res.text(); if(text.includes('255131')||text.includes('2551310')||text.includes('7.99')) hits.push({url:res.url(),status:res.status(),text:text.slice(0,16000)});}catch{}
          });
          await page.goto(origin+'/products',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(5000);
          console.log('INITIAL_BEGIN'); console.log((await page.locator('body').innerText()).slice(0,10000)); console.log('INITIAL_END');
          const inputs=page.locator('input[type="text"],input[type="search"],input:not([type])');
          console.log('INPUTS',JSON.stringify(await inputs.evaluateAll(els=>els.map((e,i)=>({i,placeholder:e.placeholder,name:e.name,aria:e.getAttribute('aria-label')})))));
          const n=await inputs.count(); let chosen=-1;
          for(let i=0;i<n;i++){const el=inputs.nth(i); const meta=((await el.getAttribute('placeholder'))||'')+' '+((await el.getAttribute('name'))||'')+' '+((await el.getAttribute('aria-label'))||''); if(/cód|cod|prod|busc|pesq|descr/i.test(meta)){chosen=i;break;}}
          if(chosen<0&&n>0) chosen=0;
          console.log('CHOSEN_INPUT',chosen);
          if(chosen>=0){await inputs.nth(chosen).fill('255131'); await page.waitForTimeout(5000);}
          console.log('AFTER_BEGIN'); console.log((await page.locator('body').innerText()).slice(0,12000)); console.log('AFTER_END');
          console.log('REQUESTS',JSON.stringify([...new Set(reqs.filter(u=>/Product|Campaign|Price|Offer|Promotion/i.test(u)))],null,2));
          console.log('HITS',JSON.stringify(hits,null,2));
          await browser.close();
          JS
          node products-probe.mjs
