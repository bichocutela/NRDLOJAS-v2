name: Apply background UI improvements safely

on:
  push:
    paths:
      - '.github/workflows/apply-background-ui-improvements-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Mestre background UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/MestreScreen.kt')
          s = p.read_text()

          def rep(old, new, name):
              global s
              if old not in s:
                  raise SystemExit(f'{name} not found')
              s = s.replace(old, new, 1)

          rep('import androidx.compose.foundation.clickable\n', 'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.gestures.detectHorizontalDragGestures\n', 'gesture import')
          rep('import androidx.compose.ui.graphics.luminance\n', 'import androidx.compose.ui.graphics.luminance\nimport androidx.compose.ui.input.pointer.pointerInput\n', 'pointer import')

          rep('''                        if (expanded) {
                            Column(modifier = Modifier.padding(start = 8.dp, top = 6.dp)) {''', '''                        if (expanded) {
                            var horizontalDragTotal by remember(themeKey) { mutableFloatStateOf(0f) }
                            Column(
                                modifier = Modifier
                                    .padding(start = 8.dp, top = 6.dp)
                                    .pointerInput(themeKey, backgroundPagination.pageIndex, backgroundPagination.pageCount) {
                                        detectHorizontalDragGestures(
                                            onDragStart = { horizontalDragTotal = 0f },
                                            onHorizontalDrag = { change, dragAmount ->
                                                change.consume()
                                                horizontalDragTotal += dragAmount
                                            },
                                            onDragEnd = {
                                                when {
                                                    horizontalDragTotal <= -80f && backgroundPagination.pageIndex < backgroundPagination.pageCount - 1 ->
                                                        backgroundPages = backgroundPages + (themeKey to (backgroundPagination.pageIndex + 1))
                                                    horizontalDragTotal >= 80f && backgroundPagination.pageIndex > 0 ->
                                                        backgroundPages = backgroundPages + (themeKey to (backgroundPagination.pageIndex - 1))
                                                }
                                                horizontalDragTotal = 0f
                                            },
                                            onDragCancel = { horizontalDragTotal = 0f }
                                        )
                                    }
                            ) {''', 'expanded background column')

          rep('''                                if (backgroundPagination.pageCount > 1) {
                                    MestrePaginationControls(
                                        pageIndex = backgroundPagination.pageIndex,
                                        pageCount = backgroundPagination.pageCount,
                                        onPrevious = {
                                            backgroundPages = backgroundPages +
                                                (themeKey to (backgroundPagination.pageIndex - 1))
                                        },
                                        onNext = {
                                            backgroundPages = backgroundPages +
                                                (themeKey to (backgroundPagination.pageIndex + 1))
                                        }
                                    )
                                }''', '''                                if (backgroundPagination.pageCount > 1) {
                                    MestrePaginationControls(
                                        pageIndex = backgroundPagination.pageIndex,
                                        pageCount = backgroundPagination.pageCount,
                                        onPrevious = {
                                            backgroundPages = backgroundPages +
                                                (themeKey to (backgroundPagination.pageIndex - 1))
                                        },
                                        onNext = {
                                            backgroundPages = backgroundPages +
                                                (themeKey to (backgroundPagination.pageIndex + 1))
                                        }
                                    )
                                    Text(
                                        "Deslize para a esquerda ou direita para trocar de página",
                                        modifier = Modifier.fillMaxWidth(),
                                        style = MaterialTheme.typography.labelSmall,
                                        color = MaterialTheme.colorScheme.onSurfaceVariant
                                    )
                                }''', 'background pagination')

          rep('''                Spacer(modifier = Modifier.height(3.dp))
                Text(
                    backgroundScheduleStatus(background),
                    style = MaterialTheme.typography.labelSmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )''', '''                Spacer(modifier = Modifier.height(4.dp))
                BackgroundScheduleDates(background)
                Spacer(modifier = Modifier.height(3.dp))
                Text(
                    backgroundScheduleStatus(background),
                    style = MaterialTheme.typography.labelSmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )''', 'schedule status block')

          rep('''            Switch(
                checked = background.isActive,
                onCheckedChange = onActiveChange,
                enabled = enabled && ThemeBackground.normalizeDate(background.startDate) != null
            )''', '''            Switch(
                checked = background.isActive,
                onCheckedChange = onActiveChange,
                enabled = enabled && ThemeBackground.normalizeDate(background.startDate) != null,
                colors = SwitchDefaults.colors(
                    uncheckedThumbColor = MaterialTheme.colorScheme.onSurfaceVariant,
                    uncheckedTrackColor = MaterialTheme.colorScheme.surfaceVariant,
                    uncheckedBorderColor = MaterialTheme.colorScheme.outline,
                    disabledUncheckedThumbColor = MaterialTheme.colorScheme.onSurfaceVariant,
                    disabledUncheckedTrackColor = MaterialTheme.colorScheme.surfaceVariant,
                    disabledUncheckedBorderColor = MaterialTheme.colorScheme.outline,
                    disabledCheckedThumbColor = MaterialTheme.colorScheme.onPrimary,
                    disabledCheckedTrackColor = MaterialTheme.colorScheme.primary
                )
            )''', 'background switch')

          rep('''        !background.isActive -> "Desativado" to (MaterialTheme.colorScheme.surfaceVariant to MaterialTheme.colorScheme.onSurfaceVariant)
        today < start -> "Agendado" to (MaterialTheme.colorScheme.tertiaryContainer to MaterialTheme.colorScheme.onTertiaryContainer)
        end != null && today > end -> "Encerrado" to (MaterialTheme.colorScheme.surfaceVariant to MaterialTheme.colorScheme.onSurfaceVariant)''', '''        !background.isActive -> "Desativado" to (MaterialTheme.colorScheme.secondaryContainer to MaterialTheme.colorScheme.onSecondaryContainer)
        today < start -> "Agendado" to (MaterialTheme.colorScheme.tertiaryContainer to MaterialTheme.colorScheme.onTertiaryContainer)
        end != null && today > end -> "Encerrado" to (MaterialTheme.colorScheme.secondaryContainer to MaterialTheme.colorScheme.onSecondaryContainer)''', 'status contrast')

          rep('''@Composable
private fun BackgroundStatusBadge(background: ThemeBackground) {''', '''@Composable
private fun BackgroundScheduleDates(background: ThemeBackground) {
    val start = ThemeBackground.normalizeDate(background.startDate)
    val end = ThemeBackground.normalizeDate(background.endDate)
    Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
        ScheduleDatePill(
            label = "Início",
            value = start?.let { formatThemeBackgroundDate(it) } ?: "Sem data",
            containerColor = MaterialTheme.colorScheme.primaryContainer,
            contentColor = MaterialTheme.colorScheme.onPrimaryContainer
        )
        ScheduleDatePill(
            label = "Fim",
            value = end?.let { formatThemeBackgroundDate(it) } ?: "Sem fim",
            containerColor = MaterialTheme.colorScheme.tertiaryContainer,
            contentColor = MaterialTheme.colorScheme.onTertiaryContainer
        )
    }
}

@Composable
private fun ScheduleDatePill(label: String, value: String, containerColor: Color, contentColor: Color) {
    Surface(color = containerColor, contentColor = contentColor, shape = RoundedCornerShape(50)) {
        Text(
            "$label: $value",
            style = MaterialTheme.typography.labelSmall,
            fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold,
            modifier = Modifier.padding(horizontal = 7.dp, vertical = 2.dp)
        )
    }
}

@Composable
private fun BackgroundStatusBadge(background: ThemeBackground) {''', 'date pill helper')

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/MestreScreen.kt
          git commit -m "feat: improve background dates contrast and swipe paging"
          git push
