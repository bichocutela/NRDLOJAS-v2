name: Capturar tráfego ACP 255131

on:
  push:
    branches: ["diag/acp-255131-live"]
    paths:
      - ".github/workflows/diag-acp-browser-255131.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Preparar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Navegar no ACP e capturar somente leituras
        env:
          ACP_LOGIN: ${{ secrets.ACP_LOGIN }}
          ACP_PASSWORD: ${{ secrets.ACP_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/probe.mjs" <<'JS'
          import { chromium } from 'playwright';
          const origin = 'https://nordestao12.acp.app.br';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();
          const hits = [];
          page.on('response', async (res) => {
            const req = res.request();
            if (req.method() !== 'GET') return;
            const url = res.url();
            if (!/acp\.app\.br/i.test(url)) return;
            const ct = (res.headers()['content-type'] || '').toLowerCase();
            if (!ct.includes('json')) return;
            try {
              const text = await res.text();
              if (text.includes('255131') || text.includes('2551310') || text.includes('7.99')) {
                let parsed;
                try { parsed = JSON.parse(text); } catch { parsed = null; }
                const out = {method:'GET', url:url.replace(/([?&](?:token|accessToken|authorization)=[^&]+)/gi,'$1REDACTED'), status:res.status()};
                if (parsed) {
                  const matches=[];
                  const walk=(v,path='')=>{
                    if (matches.length>=25) return;
                    if (v && typeof v==='object') {
                      if (!Array.isArray(v)) {
                        const s=JSON.stringify(v);
                        if (s.includes('255131') || s.includes('2551310') || s.includes('7.99')) {
                          const safe={};
                          for (const [k,val] of Object.entries(v)) {
                            if (!/token|password|cookie|authorization/i.test(k) && (val===null || ['string','number','boolean'].includes(typeof val))) safe[k]=val;
                          }
                          if (Object.keys(safe).length) matches.push({path, fields:safe});
                        }
                      }
                      if (Array.isArray(v)) v.forEach((x,i)=>walk(x,`${path}[${i}]`));
                      else Object.entries(v).forEach(([k,x])=>{ if (!/token|password|cookie|authorization/i.test(k)) walk(x,path?`${path}.${k}`:k); });
                    }
                  };
                  walk(parsed);
                  out.matches=matches;
                }
                hits.push(out);
              }
            } catch {}
          });

          await page.goto(origin + '/login', {waitUntil:'domcontentloaded', timeout:60000});
          const login = page.locator('input[name="login"], input[type="text"], input:not([type])').first();
          const pass = page.locator('input[name="password"], input[type="password"]').first();
          await login.fill(process.env.ACP_LOGIN);
          await pass.fill(process.env.ACP_PASSWORD);
          const submit = page.locator('button[type="submit"], button:has-text("Entrar")').first();
          await submit.click();
          await page.waitForTimeout(3000);
          await page.goto(origin + '/print-template', {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(4000);

          const inputs = await page.locator('input').evaluateAll(els => els.map((e,i)=>({i,type:e.type,placeholder:e.placeholder,name:e.name,aria:e.getAttribute('aria-label')})));
          console.log('INPUTS', JSON.stringify(inputs));
          const candidates = page.locator('input[type="text"], input:not([type]), input[type="search"]');
          const count = await candidates.count();
          let used = false;
          for (let i=0;i<count;i++) {
            const el=candidates.nth(i);
            const meta=((await el.getAttribute('placeholder'))||'')+' '+((await el.getAttribute('aria-label'))||'')+' '+((await el.getAttribute('name'))||'');
            if (/prod|pesq|busc|cód|cod|ean|barra/i.test(meta)) {
              await el.fill('255131');
              await page.waitForTimeout(3500);
              used=true;
              break;
            }
          }
          if (!used && count>0) { await candidates.first().fill('255131'); await page.waitForTimeout(3500); }
          const productText = page.getByText(/TANGERINA IMPORTADA/i).first();
          if (await productText.count()) {
            await productText.click().catch(()=>{});
            await page.waitForTimeout(4000);
          }
          console.log('HITS_BEGIN');
          console.log(JSON.stringify(hits,null,2));
          console.log('HITS_END');
          await browser.close();
          JS
          node "$RUNNER_TEMP/probe.mjs"
