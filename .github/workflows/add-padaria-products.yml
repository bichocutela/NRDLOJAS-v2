name: Editar foto do produto pelo Mestre

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-padaria-products.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adicionar edição de foto somente para Mestre
        run: python3 .github/data-jobs/edit-product-photo-master.py

      - name: Conferir escopo
        run: |
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/example/ui/ProductBarcodeDialog.kt"
          grep -q 'Editar Foto' app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          grep -q 'managementRoleForEmail' app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          grep -q 'uploadImageToStorage' app/src/main/java/com/example/ui/ProductBarcodeDialog.kt

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          git commit -m "Permite Mestre editar foto pelo leitor"
          git push origin HEAD:main
