name: Adicionar produtos Padaria

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-padaria-products.yml"
  workflow_dispatch:

jobs:
  add-products:
    runs-on: ubuntu-latest
    steps:
      - name: Finalizar inclusão sem duplicar e notificar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          STATUS=$(curl --max-time 60 --retry 2 --retry-delay 2 -sS -o /tmp/result.json -w '%{http_code}' "${SUPABASE_URL}/functions/v1/add-padaria-products-once")
          cat /tmp/result.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "Falha HTTP $STATUS"
            exit 1
          fi
          jq -e '.ok == true' /tmp/result.json >/dev/null
