name: Corrigir cota ao adicionar produto

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-padaria-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir leituras redundantes do catálogo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/ui/MainViewModel.kt")
          text = path.read_text()

          replacements = [
              (
                  '''            if (FirebaseService.productExists(normalizedCode)) {\n                _syncMessage.emit("Código já cadastrado na nuvem. Escolha outro código.")\n                return false\n            }\n''',
                  ''''''
              ),
              (
                  '''        if (FirebaseService.productExists(normalizedCode)) {\n            _syncMessage.emit("Código já cadastrado na nuvem. O produto existente foi preservado.")\n            return false\n        }\n''',
                  ''''''
              ),
              (
                  '''        viewModelScope.launch {\n            repository.populateInitialDataIfNeeded()\n            syncProductsFromFirebase()\n        }\n''',
                  '''        viewModelScope.launch {\n            repository.populateInitialDataIfNeeded()\n            // O listener observeProductUsage() já mantém o catálogo local sincronizado.\n            // Evita uma segunda leitura completa da coleção em toda inicialização.\n        }\n'''
              ),
              (
                  '''        const val GLOBAL_VIEW_DEBOUNCE_MS = 60_000L\n''',
                  '''        const val GLOBAL_VIEW_DEBOUNCE_MS = 5 * 60_000L\n'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Trecho esperado não encontrado:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Corrigir Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Validar testes e compilação debug
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'com.example.data.GlobalProductUsageTest' \
            --tests 'com.example.ui.theme.GlassSoftThemeTest'
          ./gradlew assembleDebug --stacktrace

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/MainViewModel.kt
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix(catalog): reduzir consumo do Firebase ao adicionar produto"
            git push
          fi
