name: Remove botão Copiar diagnóstico

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-padaria-products.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover somente o botão e resíduos visuais
        run: |
          python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Conferir escopo
        run: |
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/example/ui/AcpProductsPanel.kt"
          ! grep -q "Copiar diagnóstico" app/src/main/java/com/example/ui/AcpProductsPanel.kt

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AcpProductsPanel.kt
          git commit -m "Remove botão Copiar diagnóstico"
          git push origin HEAD:main
