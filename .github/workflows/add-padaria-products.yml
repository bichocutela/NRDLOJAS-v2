name: Salvar foto por link do Mestre

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-padaria-products.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção de prévia e salvar
        run: python3 .github/data-jobs/fix-pasted-photo-save.py

      - name: Conferir escopo
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt app/src/main/java/com/example/ui/MainViewModel.kt app/src/main/java/com/example/ui/SearchScreen.kt
          git commit -m "Corrige salvamento de foto por link"
          git push
