name: Corrigir alteracao de codigo sem leituras extras

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-padaria-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir troca de codigo sem consumir leituras do Firestore
        env:
          REPLACEMENT_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re

          path = Path("app/src/main/java/com/example/data/CatalogAdminOperations.kt")
          text = path.read_text()
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode()
          pattern = re.compile(
              r"    suspend fun replaceProductCodeAtomically\(oldCode: String, product: Product\): CreateProductResult \{.*?\n    \}\n\n    suspend fun saveImportedProductsIfAbsent",
              re.S,
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Funcao esperada nao encontrada ou encontrada {count} vezes")
          path.write_text(updated)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Corrigir Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Validar testes e compilacao debug
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'com.example.data.GlobalProductUsageTest' \
            --tests 'com.example.ui.theme.GlassSoftThemeTest'
          ./gradlew assembleDebug --stacktrace

      - name: Commitar correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/CatalogAdminOperations.kt
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
          else
            git commit -m "fix(catalog): alterar codigo sem consumir leituras extras"
            git push
          fi
