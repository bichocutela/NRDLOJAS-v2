name: Colar link de foto pelo Mestre

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-padaria-products.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar Colar Link de foto
        run: python3 .github/data-jobs/add-paste-image-link-master.py

      - name: Conferir escopo
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "app/src/main/java/com/example/ui/ProductBarcodeDialog.kt"
          grep -q 'Text("Colar Link")' app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          grep -q 'Nenhum upload foi feito' app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          git diff -- app/src/main/java/com/example/ui/ProductBarcodeDialog.kt

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt
          git commit -m "Permite Mestre colar link externo de foto"
          git push origin main
