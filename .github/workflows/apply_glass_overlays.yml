name: Aplicar Glass em diálogos e balões

on:
  push:
    paths:
      - '.github/workflows/apply_glass_overlays.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar Glass aos overlays
        shell: python
        run: |
          from pathlib import Path

          # Product barcode dialog
          p = Path('app/src/main/java/com/example/ui/ProductBarcodeDialog.kt')
          s = p.read_text()

          anchor = '    val uppercaseBold by userPreferences.uppercaseBold.collectAsState(initial = false)\n'
          insert = '''    val uppercaseBold by userPreferences.uppercaseBold.collectAsState(initial = false)\n    val appTheme by userPreferences.appTheme.collectAsState(initial = "multicolor")\n    val glassTransparency by userPreferences.glassTransparency.collectAsState(initial = 0.55f)\n    val glassType by userPreferences.glassType.collectAsState(initial = "soft")\n    val isGlassTheme = appTheme == "glass"\n    val glassBaseAlpha = (1f - glassTransparency).coerceIn(0.10f, 0.80f)\n    val glassDialogAlpha = when (glassType) {\n        "frosted" -> (glassBaseAlpha + 0.18f).coerceIn(0.22f, 0.86f)\n        "crystal" -> (glassBaseAlpha - 0.12f).coerceIn(0.08f, 0.62f)\n        else -> glassBaseAlpha\n    }\n    val glassDialogColor = when (glassType) {\n        "frosted" -> Color(0xFFF7FAFC).copy(alpha = glassDialogAlpha)\n        "crystal" -> Color.White.copy(alpha = glassDialogAlpha)\n        else -> Color(0xFFFBFDFF).copy(alpha = glassDialogAlpha)\n    }\n    val glassDialogBorder = when (glassType) {\n        "crystal" -> Color.White.copy(alpha = 0.96f)\n        "frosted" -> Color.White.copy(alpha = 0.84f)\n        else -> Color.White.copy(alpha = 0.76f)\n    }\n'''
          if anchor not in s:
              raise SystemExit('dialog prefs anchor missing')
          s = s.replace(anchor, insert, 1)

          old = '''                    color = if (highlightedFromNotification) {\n                        MaterialTheme.colorScheme.primaryContainer\n                    } else {\n                        MaterialTheme.colorScheme.surface\n                    },\n                    border = if (highlightedFromNotification) {\n                        BorderStroke(3.dp, MaterialTheme.colorScheme.primary)\n                    } else {\n                        null\n                    },\n'''
          new = '''                    color = when {\n                        highlightedFromNotification -> MaterialTheme.colorScheme.primaryContainer\n                        isGlassTheme -> glassDialogColor\n                        else -> MaterialTheme.colorScheme.surface\n                    },\n                    border = when {\n                        highlightedFromNotification -> BorderStroke(3.dp, MaterialTheme.colorScheme.primary)\n                        isGlassTheme -> BorderStroke(1.dp, glassDialogBorder)\n                        else -> null\n                    },\n'''
          if old not in s:
              raise SystemExit('dialog surface block missing')
          s = s.replace(old, new, 1)

          old = '''            AlertDialog(\n                onDismissRequest = { showPhotoDialog = false },\n'''
          new = '''            AlertDialog(\n                onDismissRequest = { showPhotoDialog = false },\n                containerColor = if (isGlassTheme) glassDialogColor else MaterialTheme.colorScheme.surfaceContainerHigh,\n'''
          if old not in s:
              raise SystemExit('photo alert block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Search screen bottom sheets
          p = Path('app/src/main/java/com/example/ui/SearchScreen.kt')
          s = p.read_text()

          replacements = {
              'ModalBottomSheet(onDismissRequest = { showProductSearchSheet = false }) {': '''ModalBottomSheet(\n                onDismissRequest = { showProductSearchSheet = false },\n                containerColor = if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else MaterialTheme.colorScheme.surfaceContainerLow\n            ) {''',
              'ModalBottomSheet(onDismissRequest = { showMostUsedSheet = false }) {': '''ModalBottomSheet(\n                onDismissRequest = { showMostUsedSheet = false },\n                containerColor = if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else MaterialTheme.colorScheme.surfaceContainerLow\n            ) {''',
              'ModalBottomSheet(onDismissRequest = { showNotificationsSheet = false }) {': '''ModalBottomSheet(\n                onDismissRequest = { showNotificationsSheet = false },\n                containerColor = if (isGlassTheme) Color.White.copy(alpha = glassSurfaceAlpha) else MaterialTheme.colorScheme.surfaceContainerLow\n            ) {'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing sheet block: {old}')
              s = s.replace(old, new, 1)

          # Category sheet has its own composable; derive Glass style locally.
          marker = '''fun CategoryProductsSheet(\n    category: String,\n    viewModel: MainViewModel,\n    appTheme: String,\n    textPreferences: HomeTextPreferences = HomeTextPreferences(),\n    onDismiss: () -> Unit\n) {\n'''
          replacement = marker + '''    val glass = rememberGlassVisualStyle(viewModel)\n'''
          if marker not in s:
              raise SystemExit('category sheet marker missing')
          s = s.replace(marker, replacement, 1)
          old = '    ModalBottomSheet(onDismissRequest = onDismiss) {'
          new = '''    ModalBottomSheet(\n        onDismissRequest = onDismiss,\n        containerColor = if (glass.enabled) glass.fill.copy(alpha = glass.alpha) else MaterialTheme.colorScheme.surfaceContainerLow\n    ) {'''
          if old not in s:
              raise SystemExit('category modal block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/ProductBarcodeDialog.kt app/src/main/java/com/example/ui/SearchScreen.kt
          git commit -m "Aplica Glass aos diálogos e bottom sheets"
          git push
