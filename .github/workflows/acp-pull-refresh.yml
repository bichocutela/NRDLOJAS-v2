name: Aplicar pull refresh ACP

on:
  push:
    branches: ["feat/acp-pull-refresh"]
    paths:
      - ".github/workflows/acp-pull-refresh.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch
        run: python3 .github/data-jobs/acp-pull-refresh.py
      - name: Validar diff
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AcpProductsPanel.kt
          git commit -m "Adiciona puxar para atualizar preços do ACP"
          git push
