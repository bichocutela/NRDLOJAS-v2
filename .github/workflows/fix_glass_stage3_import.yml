name: Corrigir import Glass Drawer

on:
  push:
    paths:
      - '.github/workflows/fix_glass_stage3_import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar import de border
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/AppNavGraph.kt')
          s = p.read_text()
          if 'import androidx.compose.foundation.border\n' not in s:
              s = s.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n', 1)
          p.write_text(s)
      - name: Commit e push
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add app/src/main/java/com/example/ui/AppNavGraph.kt
          git commit -m "Corrige import do Glass no menu lateral"
          git push
