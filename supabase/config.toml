# Firebase JWT is verified inside the function; a Supabase anon key is not a user identity.
[functions.nrd-price-gateway]
verify_jwt = false

[functions.nrd-account-admin]
# Firebase ID tokens are verified cryptographically in the function, with Mestre authorization.
verify_jwt = false

[functions.nrd-installation-event]
# SHA-256 capability authenticates an immutable Firestore event. No arbitrary FCM payloads accepted.
verify_jwt = false

[functions.nrd-promotion-control]
# Firebase JWT and device session are verified in the function.
verify_jwt = false

[functions.nrd-encartes]
verify_jwt = true

[functions.nrd-stores]
verify_jwt = true

[functions.nrd-store-offers]
verify_jwt = true

[functions.nrd-mail-import]
# Firebase JWT for Mestre; one-time connector capability for ingestion only.
verify_jwt = false

[functions.nrd-integration-logins]
# Firebase JWT is verified cryptographically; only the authenticated Mestre can rotate logins.
verify_jwt = false

[functions.nrd-product-image]
verify_jwt = true
